<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>UI Playground Beta — 61 Styles Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>

<style>
  :root {
    --bg: #04060a;
    --ink: #f0f4fc;
    --dim: #8b95a8;
    --line: rgba(240, 244, 252, 0.14);
    --line-strong: rgba(240, 244, 252, 0.3);
    --accent: #6c8cff;
    --card-w: min(920px, 86vw);
    --card-h: min(62vh, 580px);
  }

  *, *::before, *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Fixed WebGL Ambient Starfield */
  #bg {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
    pointer-events: none;
  }

  /* Topbar Navigation */
  .topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 50;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 32px;
    background: linear-gradient(180deg, rgba(4, 6, 10, 0.95) 0%, rgba(4, 6, 10, 0) 100%);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    pointer-events: none;
  }

  .topbar a, .topbar .brand {
    pointer-events: auto;
  }

  .brand {
    font-weight: 800;
    letter-spacing: -0.02em;
    font-size: 1.05rem;
    color: var(--ink);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand .seal {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 14px var(--accent);
    transition: background 0.4s ease, box-shadow 0.4s ease;
  }

  .nav {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .nav a {
    color: var(--dim);
    text-decoration: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.05em;
    transition: color 0.25s ease;
  }

  .nav a:hover {
    color: var(--ink);
  }

  .nav .count {
    color: #ffffff;
    background: rgba(108, 140, 255, 0.15);
    border: 1px solid var(--accent);
    border-radius: 9999px;
    padding: 5px 14px;
    font-weight: 700;
    transition: all 0.3s ease;
  }

  .nav .count:hover {
    background: var(--accent);
    color: #04060a;
  }

  /* ============================================================
     BONHOMME 2-CARD VIRTUAL WHEEL STAGE
     ============================================================ */
  #viewportStage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1400px;
    overflow: hidden;
  }

  /* Clean 3D Card Window */
  .v-card {
    position: absolute;
    width: var(--card-w);
    height: var(--card-h);
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #080b12;
    box-shadow: 0 35px 90px rgba(0, 0, 0, 0.85);
    cursor: pointer;
    transform-origin: center center;
    will-change: transform, opacity;
    transition: border-color 0.35s ease, box-shadow 0.35s ease;
  }

  .v-card:hover {
    border-color: var(--accent);
    box-shadow: 0 45px 110px rgba(0, 0, 0, 0.95), 0 0 35px rgba(108, 140, 255, 0.25);
  }

  /* Preview Iframe with scrollbar hidden inside card */
  .prev-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #06070c;
    pointer-events: none;
    overflow: hidden;
  }

  /* Hover Action Pill */
  .card-hover-action {
    position: absolute;
    bottom: 18px;
    right: 22px;
    z-index: 8;
    pointer-events: auto;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    padding: 10px 22px;
    border-radius: 9999px;
    border: 1px solid var(--line-strong);
    background: rgba(8, 11, 18, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--ink);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .v-card:hover .card-hover-action {
    background: var(--accent);
    color: #04060a;
    border-color: var(--accent);
    transform: scale(1.06);
    box-shadow: 0 0 25px rgba(108, 140, 255, 0.6);
  }

  /* Cover Card Specifics */
  .cover-card {
    background: radial-gradient(circle at 50% 40%, rgba(20, 26, 44, 0.85), rgba(4, 6, 10, 0.98));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
  }

  .cover-card h1 {
    font-size: clamp(42px, 8vw, 92px);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -0.03em;
    color: #ffffff;
  }

  .cover-card .sub {
    margin-top: 16px;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-weight: 700;
  }

  .cover-card .scrollhint {
    margin-top: 44px;
    color: var(--dim);
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.18em;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: bob 2s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0); opacity: 0.6; }
    50% { transform: translateY(8px); opacity: 1; }
  }

  /* ============================================================
     LEFT HUD METADATA PANEL (CLEAN & NON-OVERLAPPING)
     ============================================================ */
  #leftHud {
    position: fixed;
    top: 50%;
    left: 36px;
    transform: translateY(-50%);
    z-index: 25;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }

  .hud-badge-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .hud-num-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 800;
    color: #ffffff;
    background: var(--accent);
    padding: 4px 12px;
    border-radius: 9999px;
    box-shadow: 0 0 16px var(--accent);
  }

  .hud-tag-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink);
    text-transform: uppercase;
    letter-spacing: 0.18em;
    background: rgba(8, 11, 18, 0.85);
    backdrop-filter: blur(8px);
    padding: 4px 12px;
    border-radius: 9999px;
    border: 1px solid var(--line);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
  }

  .hud-title {
    font-size: clamp(1.4rem, 2.2vw, 2.0rem);
    font-weight: 800;
    color: #ffffff;
    line-height: 1.1;
    letter-spacing: -0.02em;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8);
  }

  .hud-desc {
    font-size: 0.85rem;
    color: var(--dim);
    line-height: 1.5;
    background: rgba(4, 6, 10, 0.6);
    backdrop-filter: blur(8px);
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.06);
  }

  /* ============================================================
     ANIMATED REVEAL LIST RAIL (VANILLA REACT-BITS STYLE)
     ============================================================ */
  #sideRailContainer {
    position: fixed;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 30;
    width: 68px;
    height: 340px;
    display: flex;
    flex-direction: column;
    opacity: 0.35;
    transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: auto;
  }

  #sideRailContainer:hover,
  #sideRailContainer.active-revealed {
    opacity: 1;
    transform: translateY(-50%) translateX(-4px);
  }

  .rail-gradient-top {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 48px;
    background: linear-gradient(180deg, var(--bg) 0%, transparent 100%);
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.3s ease;
  }

  .rail-gradient-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: linear-gradient(0deg, var(--bg) 0%, transparent 100%);
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.3s ease;
  }

  #sideRail {
    height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 50px 6px;
    scroll-behavior: smooth;
  }

  #sideRail::-webkit-scrollbar {
    display: none;
  }

  .rail-step {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    color: var(--dim);
    background: rgba(10, 14, 22, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    padding: 6px 8px;
    border-radius: 9999px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    text-align: center;
    will-change: transform, opacity;
    transform: scale(0.85);
    opacity: 0.45;
  }

  .rail-step:hover {
    color: #ffffff;
    border-color: var(--accent);
    transform: scale(1.02);
    opacity: 0.9;
  }

  .rail-step.active {
    background: var(--accent);
    color: #04060a;
    border-color: var(--accent);
    box-shadow: 0 0 16px var(--accent);
    transform: scale(1.14);
    opacity: 1;
    font-weight: 800;
  }

  /* ============================================================
     SEAMLESS FULLSCREEN ZOOM-IN PORTAL READER (TOP-RIGHT CLOSE)
     ============================================================ */
  .zoom-portal {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 100;
    pointer-events: none;
    opacity: 0;
    visibility: hidden;
    background: rgba(2, 3, 6, 0.98);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .zoom-portal.active {
    pointer-events: auto;
    visibility: visible;
  }

  .portal-viewport {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #04060a;
    border-radius: 0;
    overflow: hidden;
    box-shadow: 0 0 100px rgba(0, 0, 0, 0.95);
    transform-origin: center center;
    will-change: transform, border-radius, width, height, top, left;
  }

  .portal-viewport iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: #04060a;
  }

  /* Top-Right Close Action Bar */
  .portal-top-close-bar {
    position: fixed;
    top: 20px;
    right: 28px;
    z-index: 99999;
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-20px);
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
  }

  .zoom-portal.active .portal-top-close-bar {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  .portal-esc-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    color: var(--dim);
    background: rgba(8, 11, 18, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 8px 16px;
    border-radius: 9999px;
    border: 1px solid var(--line);
    cursor: pointer;
    transition: all 0.25s ease;
  }

  .portal-esc-pill:hover {
    color: #ffffff;
    border-color: var(--line-strong);
    background: rgba(16, 22, 34, 0.95);
  }

  .portal-esc-pill kbd {
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.68rem;
    margin-left: 4px;
  }

  .btn-portal-close {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line-strong);
    background: rgba(10, 14, 22, 0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: #ffffff;
    font-size: 1.15rem;
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
  }

  .btn-portal-close:hover {
    background: #ffffff;
    color: #04060a;
    transform: scale(1.1);
    border-color: #ffffff;
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
  }

  /* Fixed Bottom Navigation HUD */
  .bottom-hud {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .progress-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    font-weight: 800;
    letter-spacing: 0.18em;
    color: #ffffff;
    background: rgba(8, 11, 18, 0.9);
    backdrop-filter: blur(12px);
    padding: 7px 22px;
    border-radius: 9999px;
    border: 1px solid var(--line-strong);
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
  }

  .wheel-indicator {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.68rem;
    color: var(--dim);
    letter-spacing: 0.12em;
    background: rgba(6, 9, 15, 0.85);
    backdrop-filter: blur(10px);
    padding: 7px 18px;
    border-radius: 9999px;
    border: 1px solid var(--line);
  }

  .zoom-portal.active ~ .bottom-hud,
  .zoom-portal.active ~ #leftHud,
  .zoom-portal.active ~ #sideRailContainer {
    opacity: 0;
    pointer-events: none;
  }

  @media (max-width: 1024px) {
    #leftHud { display: none; }
    #sideRailContainer { display: none; }
    :root { --card-w: 92vw; --card-h: 68vh; }
  }
</style>
</head>
<body>

<!-- WebGL Ambient Starfield -->
<canvas id="bg" aria-hidden="true"></canvas>

<!-- Topbar Navigation -->
<header class="topbar">
  <a class="brand" href="index.html">
    <span class="seal" id="brandSeal"></span>
    <span>UI Playground</span>
  </a>
  <nav class="nav">
    <a href="showcase.html">Showcase</a>
    <a href="case-studies/index.html">Case Studies</a>
    <a href="component/index.html">Components</a>
    <a href="atelier-fusion-system.html">Fusion</a>
    <a href="experiments/spatial-worlds.html">10 Worlds</a>
    <a class="count" href="showcase.html">61 STYLES</a>
  </nav>
</header>

<!-- Left HUD Metadata Panel -->
<aside id="leftHud">
  <div class="hud-badge-row">
    <span class="hud-num-badge" id="hudNum">#01</span>
    <span class="hud-tag-badge" id="hudTag">NEOBRUTALISM</span>
  </div>
  <h2 class="hud-title" id="hudTitle">Neobrutalism Landing</h2>
  <p class="hud-desc" id="hudDesc">Border tebal, flat color neon, offset hard-shadow</p>
</aside>

<!-- Animated Reveal Stepper Rail (React-Bits AnimatedList Style in Vanilla JS) -->
<nav id="sideRailContainer" aria-label="Quick Jump Stepper">
  <div class="rail-gradient-top" id="railGradTop"></div>
  <div id="sideRail"></div>
  <div class="rail-gradient-bottom" id="railGradBottom"></div>
</nav>

<!-- Bonhomme 2-Card Viewport Stage (Infinite Wheel Loop) -->
<main id="viewportStage" aria-live="polite">
  <!-- Max 2 cards managed dynamically by the Virtual Wheel Engine -->
</main>

<!-- Fullscreen Zoom Portal Modal (With Top-Right Floating Controls) -->
<div class="zoom-portal" id="zoomPortal" aria-modal="true" role="dialog">
  <div class="portal-viewport" id="portalViewport">
    <iframe id="portalFrame" title="Interactive UI Universe Viewport" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
  </div>
  
  <div class="portal-top-close-bar">
    <div class="portal-esc-pill">KEMBALI <kbd>ESC</kbd></div>
    <button class="btn-portal-close" id="btnPortalClose" aria-label="Tutup dan kembali ke galeri">✕</button>
  </div>
</div>

<!-- Bottom Navigation HUD -->
<div class="bottom-hud">
  <div class="progress-pill" id="progressPill">01 / 61</div>
  <div class="wheel-indicator">WHEEL / ARROW TO FLIP ↑↓ (INFINITE LOOP)</div>
</div>

<!-- Data source & Logic -->
<script src="data/styles.js"></script>
<script>
  (function() {
    "use strict";

    /* ============================================================
       VIRTUAL WHEEL ENGINE — HOW IT WORKS (documentation pass)
       - ALL_ENTRIES = cover (index 0) + window.STYLES (1..61). The
         wheel cycles these with an INFINITE LOOP via modulo
         (see goToNext / goToPrev / jumpToIndex).
       - Only TWO cards live in the DOM at once: the active card and the
         incoming card (built on demand). The outgoing card is removed
         after the transition completes — a recycling scheme that keeps
         memory low even with 61 entries.
       - Input -> transitionToCard(target, direction):
           · wheel: delta accumulates, snaps past a threshold + throttle
           · touch: vertical swipe (>40px)
           · keys: ArrowUp/Down, PageUp/Down, Space
       - Animation (GSAP): outgoing card slides down/away while incoming
         rises into place (scale 0.58 -> 1.0, y 100vh -> 0).
       - Depth: pointermove tilts the active card (rotationX/Y + small
         x/y offset), eased by GSAP, for a 3D parallax feel.
       - HUD + rail: updateHUD / revealAndCenterRail sync the left
         metadata panel and the numbered stepper (click = jumpToIndex).
       - Zoom portal: card click opens the full-screen reader
         (portalViewport iframe) with top-right close bar + theme switch.
       This comment pass documents behavior only; logic is unchanged.
       ============================================================ */

  if (typeof window.STYLES === "undefined") {
    console.error("Critical: window.STYLES is not defined.");
    return;
  }

  // Prepend Cover Entry as Index 0
  const ALL_ENTRIES = [
    {
      id: 0,
      isCover: true,
      title: "61 STYLES UNIVERSE",
      desc: "Bonhomme Spatial Infinite Wheel Engine · UI Playground Beta",
      path: ""
    },
    ...window.STYLES
  ];

  const totalEntries = ALL_ENTRIES.length;
  const viewportStage = document.getElementById("viewportStage");
  const zoomPortal = document.getElementById("zoomPortal");
  const portalViewport = document.getElementById("portalViewport");
  const portalFrame = document.getElementById("portalFrame");
  const btnPortalClose = document.getElementById("btnPortalClose");
  const progressPill = document.getElementById("progressPill");
  const brandSeal = document.getElementById("brandSeal");

  // Left HUD elements
  const leftHud = document.getElementById("leftHud");
  const hudNum = document.getElementById("hudNum");
  const hudTag = document.getElementById("hudTag");
  const hudTitle = document.getElementById("hudTitle");
  const hudDesc = document.getElementById("hudDesc");

  // Side Rail elements
  const sideRailContainer = document.getElementById("sideRailContainer");
  const sideRail = document.getElementById("sideRail");
  const railGradTop = document.getElementById("railGradTop");
  const railGradBottom = document.getElementById("railGradBottom");

  // Color utilities
  function hslToHex(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => {
      const c = l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
      return Math.round(255 * c).toString(16).padStart(2, '0');
    };
    return '#' + f(0) + f(8) + f(4);
  }

  function themeAccent(s) {
    if (s.isCover) return "#6c8cff";
    const src = (s.guide && s.guide.key || '') + ' ' + (s.title || '');
    const m = src.match(/#[0-9a-fA-F]{6}/i);
    if (m) return m[0].toUpperCase();
    const h = (s.id * 47) % 360;
    return hslToHex(h, 72, 60);
  }

  // ============================================================
  // BUILD ANIMATED REVEAL LIST RAIL ITEMS (CONSECUTIVE 01..61)
  // ============================================================
  ALL_ENTRIES.forEach((s, idx) => {
    const b = document.createElement("button");
    b.className = "rail-step";
    b.textContent = s.isCover ? "TOP" : "#" + String(s.id).padStart(2, '0');
    b.dataset.targetIndex = String(idx);
    
    b.addEventListener("mouseenter", () => {
      gsap.to(b, { scale: 1.06, opacity: 1, duration: 0.2, ease: "power2.out" });
    });
    b.addEventListener("mouseleave", () => {
      if (!b.classList.contains("active")) {
        gsap.to(b, { scale: 0.85, opacity: 0.45, duration: 0.2, ease: "power2.out" });
      }
    });
    b.onclick = () => jumpToIndex(idx);
    sideRail.appendChild(b);
  });

  // Handle Rail Gradient opacity on scroll
  sideRail.addEventListener("scroll", () => {
    const { scrollTop, scrollHeight, clientHeight } = sideRail;
    railGradTop.style.opacity = Math.min(scrollTop / 30, 1);
    const bottomDist = scrollHeight - (scrollTop + clientHeight);
    railGradBottom.style.opacity = Math.min(bottomDist / 30, 1);
  });

  // Create Card Element Builder
  function createCardElement(dataIndex) {
    const s = ALL_ENTRIES[dataIndex];
    const accent = themeAccent(s);
    const card = document.createElement("div");
    card.className = "v-card" + (s.isCover ? " cover-card" : "");
    card.dataset.index = String(dataIndex);
    card.dataset.path = s.path;
    card.style.setProperty("--accent", accent);

    if (s.isCover) {
      card.innerHTML = `
        <span class="hud-tag-badge" style="margin-bottom: 20px; font-weight:700;">BONHOMME SPATIAL WHEEL</span>
        <h1>61 STYLES<br/>UNIVERSE</h1>
        <div class="sub">IMMERSIVE UI PLAYGROUND · BETA</div>
        <div class="scrollhint">
          <span>SCROLL / WHEEL DOWN TO FLIP</span>
          <span>↓</span>
        </div>
      `;
    } else {
      card.innerHTML = `
        <iframe class="prev-frame" src="${s.path}" title="${s.title}" scrolling="no" loading="eager" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
        <button class="card-hover-action" data-path="${s.path}">
          <span>Masuk ke UI</span>
          <span>↗</span>
        </button>
      `;
    }

    card.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!s.isCover && s.path) {
        openZoomPortal(card, s.path, accent);
      } else if (s.isCover) {
        goToNext();
      }
    });

    return card;
  }

  // ============================================================
  // BONHOMME DECK ZOOM-OUT DOWNWARDS & ENLARGE PHYSICS
  // ============================================================
  let currentIndex = 0;
  let isTransitioning = false;
  let activeCardEl = null;
  let railHideTimer = null;

  // Mount Initial Card
  activeCardEl = createCardElement(0);
  gsap.set(activeCardEl, { y: 0, scale: 1.0, opacity: 1.0, zIndex: 2 });
  viewportStage.appendChild(activeCardEl);
  updateHUD(0);

  function updateHUD(idx) {
    const s = ALL_ENTRIES[idx];
    const accent = themeAccent(s);

    if (s.isCover) {
      progressPill.textContent = "COVER / 61";
      if (leftHud) leftHud.style.opacity = "0";
    } else {
      progressPill.textContent = `${String(s.id).padStart(2, '0')} / ${String(totalEntries - 2).padStart(2, '0')}`;
      if (leftHud) {
        leftHud.style.opacity = "1";
        hudNum.textContent = "#" + String(s.id).padStart(2, '0');
        hudTag.textContent = s.title.split(" ")[0].toUpperCase();
        hudTitle.textContent = s.title;
        hudDesc.textContent = s.desc || s.title;
      }
    }

    document.documentElement.style.setProperty("--accent", accent);
    if (brandSeal) brandSeal.style.backgroundColor = accent;

    // Reveal Animated Rail & Animate Step Selection
    revealAndCenterRail(idx);
  }

  function revealAndCenterRail(idx) {
    sideRailContainer.classList.add("active-revealed");
    clearTimeout(railHideTimer);

    // Auto-fade rail after 2.4s of inactivity
    railHideTimer = setTimeout(() => {
      sideRailContainer.classList.remove("active-revealed");
    }, 2400);

    const steps = Array.from(document.querySelectorAll(".rail-step"));
    let activeStepEl = null;

    steps.forEach(step => {
      const stepIdx = Number(step.dataset.targetIndex);
      const isActive = stepIdx === idx;
      step.classList.toggle("active", isActive);

      if (isActive) {
        activeStepEl = step;
        gsap.to(step, {
          scale: 1.14,
          opacity: 1.0,
          duration: 0.35,
          ease: "back.out(2)"
        });
      } else {
        gsap.to(step, {
          scale: 0.85,
          opacity: 0.45,
          duration: 0.25,
          ease: "power2.out"
        });
      }
    });

    // Smoothly center the active item inside the animated rail container
    if (activeStepEl) {
      const itemTop = activeStepEl.offsetTop;
      const itemHeight = activeStepEl.offsetHeight;
      const containerHeight = sideRail.clientHeight;
      const targetScroll = itemTop - (containerHeight / 2) + (itemHeight / 2);
      sideRail.scrollTo({ top: targetScroll, behavior: "smooth" });
    }
  }

  function goToNext() {
    if (isTransitioning || isPortalOpen) return;
    const nextIndex = (currentIndex + 1) % totalEntries;
    transitionToCard(nextIndex, "next");
  }

  function goToPrev() {
    if (isTransitioning || isPortalOpen) return;
    const prevIndex = (currentIndex - 1 + totalEntries) % totalEntries;
    transitionToCard(prevIndex, "prev");
  }

  function jumpToIndex(targetIdx) {
    if (isTransitioning || isPortalOpen || targetIdx === currentIndex) return;
    const direction = targetIdx > currentIndex ? "next" : "prev";
    transitionToCard(targetIdx, direction);
  }

  function transitionToCard(targetIndex, direction) {
    isTransitioning = true;
    const incomingCard = createCardElement(targetIndex);
    const outgoingCard = activeCardEl;

    if (direction === "next") {
      gsap.set(incomingCard, { y: "100vh", scale: 0.72, opacity: 0.3, zIndex: 3 });
      viewportStage.appendChild(incomingCard);

      const tl = gsap.timeline({
        onComplete: () => {
          if (outgoingCard && outgoingCard.parentNode) {
            outgoingCard.parentNode.removeChild(outgoingCard);
          }
          activeCardEl = incomingCard;
          currentIndex = targetIndex;
          isTransitioning = false;
          updateHUD(currentIndex);
        }
      });

      tl.to(outgoingCard, {
        y: "40vh",
        scale: 0.58,
        opacity: 0,
        duration: 0.65,
        ease: "power3.inOut"
      }, 0);

      tl.to(incomingCard, {
        y: "0vh",
        scale: 1.0,
        opacity: 1.0,
        duration: 0.65,
        ease: "power3.inOut"
      }, 0);

    } else {
      gsap.set(incomingCard, { y: "40vh", scale: 0.58, opacity: 0.2, zIndex: 1 });
      viewportStage.insertBefore(incomingCard, activeCardEl);

      const tl = gsap.timeline({
        onComplete: () => {
          if (outgoingCard && outgoingCard.parentNode) {
            outgoingCard.parentNode.removeChild(outgoingCard);
          }
          activeCardEl = incomingCard;
          currentIndex = targetIndex;
          isTransitioning = false;
          updateHUD(currentIndex);
        }
      });

      tl.to(outgoingCard, {
        y: "100vh",
        scale: 0.72,
        opacity: 0,
        duration: 0.65,
        ease: "power3.inOut"
      }, 0);

      tl.to(incomingCard, {
        y: "0vh",
        scale: 1.0,
        opacity: 1.0,
        duration: 0.65,
        ease: "power3.inOut"
      }, 0);
    }
  }

  // ============================================================
  // MOUSE 3D PARALLAX DEPTH CONTROLLER
  // ============================================================
  let mouseNormX = 0;
  let mouseNormY = 0;

  window.addEventListener("pointermove", (e) => {
    if (isPortalOpen) return;
    mouseNormX = (e.clientX / window.innerWidth) - 0.5;
    mouseNormY = (e.clientY / window.innerHeight) - 0.5;

    if (activeCardEl && !isTransitioning) {
      gsap.to(activeCardEl, {
        rotationY: mouseNormX * 8,
        rotationX: -mouseNormY * 8,
        x: mouseNormX * 16,
        y: mouseNormY * 10,
        duration: 0.5,
        ease: "power2.out"
      });
    }
  });

  // ============================================================
  // SNAPPY WHEEL & TOUCH CONTROLLER
  // ============================================================
  let wheelDeltaSum = 0;
  let lastWheelTime = 0;

  window.addEventListener("wheel", (e) => {
    if (isPortalOpen) return;
    const now = performance.now();
    
    if (isTransitioning) return;

    wheelDeltaSum += e.deltaY;

    if (Math.abs(wheelDeltaSum) > 25 && now - lastWheelTime > 180) {
      if (wheelDeltaSum > 0) {
        goToNext();
      } else {
        goToPrev();
      }
      wheelDeltaSum = 0;
      lastWheelTime = now;
    }
  }, { passive: true });

  let touchStartY = null;
  window.addEventListener("touchstart", (e) => {
    if (e.touches && e.touches[0]) touchStartY = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener("touchend", (e) => {
    if (touchStartY === null || isPortalOpen || isTransitioning) return;
    const touchEndY = e.changedTouches[0].clientY;
    const diff = touchStartY - touchEndY;
    touchStartY = null;

    if (diff > 40) {
      goToNext();
    } else if (diff < -40) {
      goToPrev();
    }
  }, { passive: true });

  // Keyboard navigation
  window.addEventListener("keydown", (e) => {
    if (isPortalOpen) {
      if (e.key === "Escape" || e.key === "x" || e.key === "X") {
        e.preventDefault();
        closeZoomPortal();
      }
      return;
    }
    if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ") {
      e.preventDefault();
      goToNext();
    } else if (e.key === "ArrowUp" || e.key === "PageUp") {
      e.preventDefault();
      goToPrev();
    }
  });

  // ============================================================
  // ZOOM-IN / ZOOM-OUT PORTAL ENGINE
  // ============================================================
  let isPortalOpen = false;

  function openZoomPortal(cardEl, path, accent) {
    if (isPortalOpen) return;
    isPortalOpen = true;

    const rect = cardEl.getBoundingClientRect();
    const startX = rect.left;
    const startY = rect.top;
    const startW = rect.width;
    const startH = rect.height;

    zoomPortal.classList.add("active");
    portalFrame.src = path;

    gsap.set(cardEl, { rotationX: 0, rotationY: 0, x: 0, y: 0 });
    gsap.set(zoomPortal, { opacity: 1 });
    gsap.fromTo(portalViewport, 
      {
        position: "fixed",
        top: startY,
        left: startX,
        width: startW,
        height: startH,
        borderRadius: "20px",
        scale: 1.0,
        boxShadow: "0 40px 100px rgba(0, 0, 0, 0.9)"
      },
      {
        top: 0,
        left: 0,
        width: "100vw",
        height: "100vh",
        borderRadius: "0px",
        scale: 1.0,
        duration: 0.6,
        ease: "power3.inOut",
        onComplete: () => {
          try {
            if (portalFrame.contentWindow) {
              portalFrame.contentWindow.dispatchEvent(new Event("resize"));
              if (portalFrame.contentWindow.ScrollTrigger) {
                portalFrame.contentWindow.ScrollTrigger.refresh();
              }
            }
          } catch(err) {}
          attachIframeKeyListeners();
          portalFrame.focus();
        }
      }
    );
  }

  function attachIframeKeyListeners() {
    try {
      if (portalFrame.contentWindow) {
        portalFrame.contentWindow.removeEventListener("keydown", handleIframeKeydown);
        portalFrame.contentWindow.addEventListener("keydown", handleIframeKeydown);
      }
      if (portalFrame.contentDocument) {
        portalFrame.contentDocument.removeEventListener("keydown", handleIframeKeydown);
        portalFrame.contentDocument.addEventListener("keydown", handleIframeKeydown);
      }
    } catch (err) {}
  }

  function handleIframeKeydown(e) {
    if (e.key === "Escape" || e.key === "x" || e.key === "X") {
      e.preventDefault();
      closeZoomPortal();
    }
  }

  portalFrame.addEventListener("load", () => {
    attachIframeKeyListeners();
  });

  function closeZoomPortal() {
    if (!isPortalOpen) return;

    if (activeCardEl) {
      const rect = activeCardEl.getBoundingClientRect();
      gsap.to(portalViewport, {
        top: rect.top,
        left: rect.left,
        width: rect.width,
        height: rect.height,
        borderRadius: "20px",
        duration: 0.5,
        ease: "power3.inOut",
        onComplete: () => {
          zoomPortal.classList.remove("active");
          portalFrame.src = "";
          isPortalOpen = false;
        }
      });

      gsap.to(zoomPortal, {
        opacity: 0,
        duration: 0.4,
        delay: 0.08
      });
    } else {
      zoomPortal.classList.remove("active");
      portalFrame.src = "";
      isPortalOpen = false;
    }
  }

  btnPortalClose.addEventListener("click", closeZoomPortal);
  const escPill = document.querySelector(".portal-esc-pill");
  if (escPill) escPill.addEventListener("click", closeZoomPortal);

  zoomPortal.addEventListener("click", (e) => {
    if (e.target === zoomPortal) closeZoomPortal();
  });

  // ============================================================
  // THREE.JS AMBIENT BACKGROUND SCENE
  // ============================================================
  if (typeof THREE !== "undefined") {
    try {
      const canvas = document.getElementById("bg");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 400);
      camera.position.z = 65;

      const group = new THREE.Group();
      scene.add(group);

      const particleCount = 1400;
      const posArr = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount * 3; i++) {
        posArr[i] = (Math.random() - 0.5) * 240;
      }
      const particleGeo = new THREE.BufferGeometry();
      particleGeo.setAttribute("position", new THREE.BufferAttribute(posArr, 3));
      const particleMat = new THREE.PointsMaterial({
        color: 0x8a93a8,
        size: 0.65,
        transparent: true,
        opacity: 0.6
      });
      group.add(new THREE.Points(particleGeo, particleMat));

      const colors = [0x6c8cff, 0xff6b6b, 0x51cf66, 0xcc5de8, 0xffd43b];
      for (let i = 0; i < 9; i++) {
        const polyGeo = i % 2 === 0 
          ? new THREE.IcosahedronGeometry(3 + Math.random() * 4, 0)
          : new THREE.OctahedronGeometry(3 + Math.random() * 3, 0);
        
        const polyMat = new THREE.MeshBasicMaterial({
          color: colors[i % colors.length],
          wireframe: true,
          transparent: true,
          opacity: 0.18
        });
        const mesh = new THREE.Mesh(polyGeo, polyMat);
        mesh.position.set(
          (Math.random() - 0.5) * 140,
          (Math.random() - 0.5) * 100,
          (Math.random() - 0.5) * 80 - 20
        );
        mesh.userData = {
          rx: (Math.random() - 0.5) * 0.004,
          ry: (Math.random() - 0.5) * 0.004
        };
        group.add(mesh);
      }

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      }, { passive: true });

      function animate() {
        requestAnimationFrame(animate);
        group.children.forEach(child => {
          if (child.userData && child.userData.rx) {
            child.rotation.x += child.userData.rx;
            child.rotation.y += child.userData.ry;
          }
        });
        group.position.x += (-mouseNormX * 22 - group.position.x) * 0.05;
        group.position.y += (mouseNormY * 16 - group.position.y) * 0.05;
        group.rotation.y += 0.0005;
        group.rotation.x = Math.sin(performance.now() * 0.0002) * 0.08;
        renderer.render(scene, camera);
      }
      animate();

    } catch (err) {
      console.warn("WebGL background error:", err);
    }
  }

})();
</script>
</body>
</html>
