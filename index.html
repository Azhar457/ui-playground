<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UI Playground Beta — 61 Styles Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#06070c; --ink:#eef1f7; --dim:#8a93a8; --line:rgba(238,241,247,.12);
    --accent:#6c8cff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory}
  body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;
    overflow-x:hidden}
  body.locked{overflow:hidden}
  #bg{position:fixed;inset:0;z-index:0;display:block}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;justify-content:space-between;
    align-items:center;padding:14px 22px;background:linear-gradient(#06070c,#06070c00);
    backdrop-filter:blur(4px);pointer-events:none}
  .topbar a,.topbar .brand{pointer-events:auto}
  .brand{font-weight:800;letter-spacing:-.02em;font-size:1rem;display:flex;align-items:center;gap:8px}
  .brand .seal{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);transition:background .4s}
  .nav a{color:var(--dim);text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:.72rem;
    margin-left:14px;transition:color .2s}
  .nav a:hover{color:var(--ink)}
  .nav .count{color:var(--accent);border:1px solid var(--accent);border-radius:9999px;padding:3px 10px}

  #gallery{position:relative;z-index:10}
  .page{height:100vh;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;
    padding:84px 24px 64px;position:relative}

  /* hero */
  .hero .stage{text-align:center}
  .hero h1{font-size:clamp(38px,9vw,108px);font-weight:800;letter-spacing:-.03em;line-height:.95}
  .hero .sub{margin-top:14px;color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:.8rem;letter-spacing:.2em}
  .scrollhint{margin-top:34px;color:var(--dim);font-size:.72rem;font-family:'JetBrains Mono',monospace;
    animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(8px);opacity:1}}

  .stage{perspective:1300px;width:min(940px,92vw)}
  .meta{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-left:4px}
  .meta .num{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--accent);font-weight:700;letter-spacing:.15em}
  .meta .tag{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--dim);text-transform:uppercase;letter-spacing:.25em;
    border:1px solid var(--line);padding:3px 9px;border-radius:9999px}
  .card{transform:rotateX(7deg);transition:transform .45s cubic-bezier(.16,1,.3,1);
    border:1px solid var(--line);border-radius:20px;overflow:hidden;
    box-shadow:0 40px 90px rgba(0,0,0,.55);cursor:pointer;background:#0b0e16}
  .card:hover{transform:rotateX(0deg) translateY(-8px)}
  .mock-top{display:flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.025)}
  .mock-top .dot{width:9px;height:9px;border-radius:50%;background:#3a4156}
  .mock-top .dot:first-child{background:#ff5f57}.mock-top .dot:nth-child(2){background:#febc2e}.mock-top .dot:nth-child(3){background:#28c840}
  .mock-title{margin-left:10px;font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--dim)}
  .mock-body{position:relative;padding:40px 36px 46px;min-height:340px;
    background:linear-gradient(135deg,var(--accent2),var(--accent));overflow:hidden}
  .mock-body::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 80% 0%,rgba(255,255,255,.18),transparent 60%),linear-gradient(0deg,rgba(4,5,9,.55),rgba(4,5,9,.05))}
  .mock-nav{position:relative;z-index:2;display:flex;gap:8px;margin-bottom:26px}
  .mock-nav span{height:9px;width:46px;border-radius:9999px;background:rgba(255,255,255,.5)}
  .mock-nav span:first-child{width:70px;background:#fff}
  .mock-hero{position:relative;z-index:2;max-width:560px}
  .mock-hero h2{font-size:clamp(26px,4.4vw,46px);font-weight:800;letter-spacing:-.02em;color:#fff;line-height:1.02}
  .mock-hero p{margin-top:10px;color:rgba(255,255,255,.82);font-size:.92rem;max-width:440px}
  .enter{margin-top:22px;pointer-events:auto;cursor:pointer;border:0;background:#fff;color:#0a0c12;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:.85rem;padding:11px 20px;border-radius:9999px;
    transition:transform .2s,box-shadow .2s}
  .enter:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .mock-cards{position:relative;z-index:2;display:flex;gap:12px;margin-top:30px}
  .mock-cards i{flex:1;height:74px;border-radius:12px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);display:block}

  .reader{position:fixed;inset:0;z-index:60;background:rgba(3,4,8,.94);display:none}
  .reader.open{display:block}
  .reader iframe{width:100%;height:100%;border:0;background:#fff}
  .reader .x{position:absolute;top:16px;right:18px;z-index:2;width:44px;height:44px;border-radius:50%;
    border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.5);color:#fff;font-size:1.1rem;cursor:pointer}
  .reader .x:hover{background:#fff;color:#000}
  .reader .hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);z-index:2;color:#fff;
    font-family:'JetBrains Mono',monospace;font-size:.62rem;opacity:.7;pointer-events:none}

  .progress{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:30;
    font-family:'JetBrains Mono',monospace;font-size:.62rem;color:var(--dim);letter-spacing:.15em;pointer-events:none}
  @media(max-width:640px){.mock-body{padding:28px 22px}.mock-cards i:nth-child(3){display:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="topbar">
  <a class="brand" href="index.html"><span class="seal"></span> UI&nbsp;Playground</a>
  <nav class="nav">
    <a href="showcase.html">Showcase</a>
    <a href="case-studies/index.html">Case&nbsp;Studies</a>
    <a href="component/index.html">Components</a>
    <a href="atelier-fusion-system.html">Fusion</a>
    <a href="experiments/spatial-worlds.html">10&nbsp;Worlds</a>
    <a class="count" href="#gallery">61 STYLES</a>
  </nav>
</div>

<main id="gallery">
  <section class="page hero">
    <div class="stage">
      <h1>61 Styles<br/>Universe</h1>
      <div class="sub">IMMERSIVE UI PLAYGROUND · BETA</div>
      <div class="scrollhint">SCROLL TO FLIP ↓ &nbsp; CLICK TO ENTER &nbsp; ESC TO EXIT</div>
    </div>
  </section>
  <!-- style pages injected by JS -->
</main>

<div class="reader" id="reader">
  <button class="x" id="readerX" aria-label="Close">✕</button>
  <iframe id="rframe" title="UI preview" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
  <div class="hint">Tekan X / ESC untuk kembali ke galeri</div>
</div>

<div class="progress" id="progress">01 / 61</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="data/styles.js"></script>
<script>
(function(){
  "use strict";
  if(typeof STYLES==="undefined"){console.error("STYLES missing");return;}

  // ---- color helpers ----
  function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12;const a=s*Math.min(l,1-l);
    const f=n=>{const c=l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return Math.round(255*c).toString(16).padStart(2,'0')};
    return '#'+f(0)+f(8)+f(4);}
  function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
    return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function rgbToHex(r){return '#'+r.map(x=>Math.round(Math.max(0,Math.min(255,x))).toString(16).padStart(2,'0')).join('');}
  function shade(hex,k){const r=hexToRgb(hex);return rgbToHex(r.map(v=>v*(1+k)));}
  function themeAccent(s){
    const src=(s.guide&&s.guide.key||'')+' '+(s.title||'');
    const m=src.match(/#[0-9a-fA-F]{6}/i);
    if(m)return m[0].toUpperCase();
    const h=(s.id*47)%360;
    return hslToHex(h,70,58);
  }

  // ---- build gallery ----
  const gallery=document.getElementById('gallery');
  const total=STYLES.length;
  STYLES.forEach((s)=>{
    const accent=themeAccent(s);
    const accent2=shade(accent,-0.55);
    const page=document.createElement('section');
    page.className='page';
    page.style.setProperty('--accent',accent);
    page.style.setProperty('--accent2',accent2);
    page.dataset.idx=String(s.id);
    page.innerHTML=
      '<div class="stage">'+
        '<div class="meta"><span class="num">#'+String(s.id).padStart(2,'0')+'</span>'+
        '<span class="tag">UI Style</span></div>'+
        '<div class="card" data-path="'+s.path+'">'+
          '<div class="mock-top"><span class="dot"></span><span class="dot"></span><span class="dot"></span>'+
          '<span class="mock-title">'+s.title+'</span></div>'+
          '<div class="mock-body"><nav class="mock-nav"><span></span><span></span><span></span><span></span></nav>'+
          '<div class="mock-hero"><h2>'+s.title+'</h2><p>'+s.desc+'</p>'+
          '<button class="enter">Masuk ke UI →</button></div>'+
          '<div class="mock-cards"><i></i><i></i><i></i></div></div>'+
        '</div>'+
      '</div>';
    gallery.appendChild(page);
    page.querySelector('.enter').addEventListener('click',(e)=>{e.stopPropagation();openReader(s.path);});
    page.querySelector('.card').addEventListener('click',()=>openReader(s.path));
  });

  // ---- reader (enter UI) ----
  const reader=document.getElementById('reader'),rframe=document.getElementById('rframe');
  function openReader(path){rframe.src=path;reader.classList.add('open');document.body.classList.add('locked');}
  function closeReader(){reader.classList.remove('open');rframe.src='';document.body.classList.remove('locked');}
  document.getElementById('readerX').addEventListener('click',closeReader);
  reader.addEventListener('click',(e)=>{if(e.target===reader)closeReader();});
  window.addEventListener('keydown',(e)=>{if(reader.classList.contains('open')&&(e.key==='Escape'||e.key==='x'||e.key==='X'))closeReader();});

  // ---- progress + accent sync ----
  const progress=document.getElementById('progress');
  const pages=[...gallery.querySelectorAll('.page')];
  const io=new IntersectionObserver((es)=>{
    es.forEach(en=>{
      if(en.isIntersecting){
        const id=en.target.dataset.idx||'';
        progress.textContent=(id?String(id).padStart(2,'0'):'00')+' / '+String(total-1).padStart(2,'0');
        const a=getComputedStyle(en.target).getPropertyValue('--accent').trim();
        if(a)document.documentElement.style.setProperty('--accent',a);
      }
    });
  },{rootMargin:'-45% 0px -45% 0px'});
  pages.forEach(p=>io.observe(p));

  // ---- WebGL ambient background ----
  if(typeof THREE!=="undefined"){
    try{
      const cv=document.getElementById('bg');
      const rnd=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
      rnd.setPixelRatio(Math.min(devicePixelRatio,2));rnd.setSize(innerWidth,innerHeight);
      const sc=new THREE.Scene();
      const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,300);cam.position.z=60;
      const grp=new THREE.Group();sc.add(grp);
      // particles
      const N=900,pn=new Float32Array(N*3);
      for(let i=0;i<N*3;i++)pn[i]=(Math.random()-0.5)*180;
      const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pn,3));
      grp.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x9fb3c8,size:0.5,transparent:true,opacity:.5})));
      // floating wireframes
      const cols=[0x6c8cff,0xff6b6b,0x51cf66,0xcc5de8,0xffd43b];
      for(let i=0;i<7;i++){
        const m=new THREE.Mesh(new THREE.IcosahedronGeometry(4+Math.random()*4,0),
          new THREE.MeshBasicMaterial({color:cols[i%cols.length],wireframe:true,transparent:true,opacity:.18}));
        m.position.set((Math.random()-0.5)*120,(Math.random()-0.5)*80,(Math.random()-0.5)*60-20);
        m.userData={sx:(Math.random()-.5)*.003,sy:(Math.random()-.5)*.003};grp.add(m);
      }
      addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();rnd.setSize(innerWidth,innerHeight);});
      addEventListener('scroll',()=>{grp.rotation.y=scrollY*0.0002;});
      (function loop(){grp.children.forEach(c=>{if(c.userData.sx){c.rotation.x+=c.userData.sx;c.rotation.y+=c.userData.sy;}});
        grp.rotation.x=Math.sin(performance.now()*0.0001)*0.1;rnd.render(sc,cam);requestAnimationFrame(loop);})();
    }catch(e){console.warn("bg webgl skipped",e);}
  }
})();
</script>
</body>
</html>
