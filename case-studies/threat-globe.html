<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THREAT GLOBE — Live Cyber Attack Map</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#ccc;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;overflow:hidden;height:100vh;width:100vw}
#globe-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
#ui-overlay{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#top-bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:linear-gradient(180deg,rgba(10,10,15,.95) 0%,rgba(10,10,15,.7) 60%,transparent 100%);pointer-events:auto;flex-wrap:wrap;gap:8px}
#top-bar h1{font-size:18px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff}
#top-bar h1 span{color:#FF1100}
.stats-row{display:flex;gap:16px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center;min-width:80px}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:#666;font-family:'Courier New',monospace}
.stat-value{font-size:16px;font-weight:700;color:#fff;font-family:'Courier New',monospace;line-height:1.3}
.stat-value.danger{color:#FF1100}
.stat-value.warning{color:#FF6600}
.stat-value.caution{color:#FFCC00}
#threat-meter{display:flex;flex-direction:column;align-items:center;min-width:60px}
#threat-meter .meter-bar{width:60px;height:4px;background:#1a1a2e;border-radius:2px;overflow:hidden;margin-top:2px}
#threat-meter .meter-fill{height:100%;border-radius:2px;width:0%;transition:width .5s ease;background:linear-gradient(90deg,#FFCC00,#FF6600,#FF1100)}
#side-panel{position:absolute;top:70px;right:12px;bottom:12px;width:340px;pointer-events:auto;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 82px)}
#log-panel{flex:1;background:rgba(10,10,15,.85);border:1px solid rgba(255,17,0,.2);border-radius:6px;display:flex;flex-direction:column;overflow:hidden;backdrop-filter:blur(8px)}
#log-header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid rgba(255,17,0,.15)}
#log-header h2{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:#FF1100;font-weight:600}
#log-filters{display:flex;gap:4px}
.filter-btn{padding:3px 8px;font-size:9px;font-family:'Courier New',monospace;background:transparent;border:1px solid rgba(255,255,255,.1);color:#666;border-radius:3px;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.5px}
.filter-btn:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.filter-btn.active{color:#FF1100;border-color:#FF1100;background:rgba(255,17,0,.1)}
#log-entries{flex:1;overflow-y:auto;padding:4px 6px;font-family:'Courier New',monospace;font-size:11px;line-height:1.5}
#log-entries::-webkit-scrollbar{width:3px}
#log-entries::-webkit-scrollbar-track{background:transparent}
#log-entries::-webkit-scrollbar-thumb{background:rgba(255,17,0,.3);border-radius:2px}
.log-entry{padding:3px 6px;margin:1px 0;border-radius:2px;display:flex;gap:6px;align-items:flex-start;animation:fadeIn .3s ease;cursor:default}
.log-entry:hover{background:rgba(255,17,0,.05)}
.log-entry .log-time{color:#555;white-space:nowrap;min-width:52px;font-size:10px}
.log-entry .log-ip{color:#888;min-width:90px;font-size:10px}
.log-entry .log-type{flex:1;font-size:10px}
.log-entry .log-sev{font-size:8px;padding:1px 5px;border-radius:2px;text-transform:uppercase;font-weight:600;letter-spacing:.5px;white-space:nowrap}
.sev-critical{background:rgba(255,17,0,.2);color:#FF1100}
.sev-high{background:rgba(255,102,0,.15);color:#FF6600}
.sev-medium{background:rgba(255,204,0,.12);color:#FFCC00}
.sev-low{background:rgba(68,68,68,.2);color:#666}
.log-empty{text-align:center;padding:40px 12px;color:#333;font-size:11px}
#tooltip{position:absolute;background:rgba(10,10,15,.92);border:1px solid rgba(255,17,0,.3);border-radius:4px;padding:8px 10px;font-family:'Courier New',monospace;font-size:11px;pointer-events:none;opacity:0;transition:opacity .15s;backdrop-filter:blur(4px);z-index:100;min-width:140px;box-shadow:0 4px 20px rgba(0,0,0,.6)}
#tooltip.visible{opacity:1}
#tooltip .tt-label{color:#666;font-size:9px;text-transform:uppercase;letter-spacing:.5px}
#tooltip .tt-value{color:#fff;margin-bottom:3px}
#tooltip .tt-value.danger{color:#FF1100}
#tooltip .tt-value.warning{color:#FF6600}
#global-stats{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:rgba(10,10,15,.7);border:1px solid rgba(255,255,255,.06);border-radius:6px;padding:6px 20px;display:flex;gap:24px;pointer-events:none;backdrop-filter:blur(4px);font-family:'Courier New',monospace;font-size:10px;color:#555;white-space:nowrap}
#global-stats .gs-value{color:#888}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
@media(max-width:768px){#side-panel{width:260px;right:8px;top:110px;max-height:calc(100vh - 120px)}#top-bar{padding:8px 12px;flex-direction:column;align-items:flex-start}#top-bar h1{font-size:14px}.stats-row{gap:10px}.stat{min-width:50px}.stat-value{font-size:13px}#global-stats{display:none}}
</style>
</head>
<body>

<div id="globe-container"></div>

<div id="ui-overlay">
  <div id="top-bar">
    <h1>THREAT<span>GLOBE</span></h1>
    <div class="stats-row">
      <div class="stat">
        <span class="stat-label">Total Today</span>
        <span class="stat-value danger" id="stat-total">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Active Threats</span>
        <span class="stat-value warning" id="stat-active">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Top Source</span>
        <span class="stat-value" id="stat-top-country" style="color:#FFCC00;font-size:13px">--</span>

        <span class="stat-label">Threat Level</span>

      </div>

  <div id="side-panel">

      <div id="log-header">
        <h2>Live Attack Log</h2>
        <div id="log-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="critical">Critical</button>
          <button class="filter-btn" data-filter="high">High</button>

  <div id="tooltip">

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ── Config ── */
const GLOBE_RADIUS = 5;
const NODE_BASE_HEIGHT = 0.08;
const ARC_SEGMENTS = 40;
const MAX_LOG_ENTRIES = 200;
const LOG_INTERVAL_MS = 1800;
const MAX_NODES = 60;
const MAX_CONNECTIONS = 80;

const ATTACK_TYPES = [
  'DDoS','SQL Injection','XSS','Brute Force','Malware','Ransomware',
  'DNS Spoofing','MITM','Zero-Day Exploit','Port Scan','Credential Stuffing',
  'Phishing','Buffer Overflow','APT Intrusion','Replay Attack','LDAP Injection'
];

const COUNTRIES = [
  'USA','CHN','RUS','PRK','IRN','BRA','IND','DEU','GBR','NGA','KOR','JPN',
  'VIE','IDN','MEX','ZAF','TUR','SAU','ISR','UKR'
];

const SEVERITIES = ['critical','high','medium','low'];
const SEV_WEIGHT = { critical: 0.15, high: 0.3, medium: 0.35, low: 0.2 };
const STATUSES = ['blocked','mitigated','active','investigating'];

/* ── Scene Setup ── */
const container = document.getElementById('globe-container');
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
camera.position.set(0, 2, 14);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.8;
controls.minDistance = 7;
controls.maxDistance = 25;
controls.target.set(0, 0, 0);

/* ── Lights ── */
const ambientLight = new THREE.AmbientLight(0x222244, 0.6);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(5, 10, 7);
scene.add(dirLight);
const backLight = new THREE.DirectionalLight(0x4488ff, 0.5);
backLight.position.set(-5, -3, -8);
scene.add(backLight);

/* ── Globe ── */
const globeGroup = new THREE.Group();
scene.add(globeGroup);

const globeGeo = new THREE.SphereGeometry(GLOBE_RADIUS, 64, 64);
const globeMat = new THREE.MeshPhongMaterial({
  color: 0x0a0a1a,
  emissive: 0x0a0a2e,
  emissiveIntensity: 0.3,
  specular: 0x111133,
  shininess: 25,
  transparent: true,
  opacity: 0.92,
});
const globeMesh = new THREE.Mesh(globeGeo, globeMat);
globeGroup.add(globeMesh);

/* ── Grid Lines ── */
function createGridLines() {
  const points = [];
  const latStep = 15;
  const lngStep = 15;
  const r = GLOBE_RADIUS * 1.002;

  for (let lat = -75; lat <= 75; lat += latStep) {
    const phi = (90 - lat) * Math.PI / 180;
    for (let lng = 0; lng <= 360; lng += 2) {
      const theta = lng * Math.PI / 180;
      points.push(
        -r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
    }
  }

  for (let lng = 0; lng < 360; lng += lngStep) {
    const theta = lng * Math.PI / 180;
    for (let lat = -90; lat <= 90; lat += 2) {
      const phi = (90 - lat) * Math.PI / 180;
      points.push(
        -r * Math.sin(phi) * Math.cos(theta),
        r * Math.cos(phi),
        r * Math.sin(phi) * Math.sin(theta)
      );
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(points, 3));
  const mat = new THREE.LineBasicMaterial({
    color: 0x1a1a3e,
    transparent: true,
    opacity: 0.6,
  });
  return new THREE.LineSegments(geo, mat);
}
globeGroup.add(createGridLines());

/* ── Continent Outlines ── */
const CONTINENT_DATA = {
  'north-america': [[-130,20],[-110,22],[-100,18],[-90,18],[-85,22],[-80,28],[-75,35],[-70,42],[-65,47],[-68,50],[-75,55],[-80,62],[-90,67],[-100,72],[-120,72],[-130,68],[-145,62],[-150,55],[-130,52],[-125,42],[-128,32],[-130,20]],
  'south-america': [[-80,10],[-75,5],[-60,5],[-50,5],[-35,0],[-35,-7],[-37,-15],[-40,-22],[-45,-25],[-50,-30],[-55,-35],[-60,-40],[-65,-46],[-70,-52],[-74,-52],[-74,-46],[-70,-30],[-73,-18],[-80,-8],[-80,10]],
  'europe': [[-10,36],[0,38],[5,42],[10,44],[15,42],[20,40],[25,40],[28,42],[30,45],[28,48],[25,50],[20,54],[15,56],[10,58],[5,60],[0,58],[-5,55],[-10,50],[-10,44],[-10,36]],
  'africa': [[-18,35],[-10,35],[-5,30],[0,30],[10,30],[12,33],[30,32],[33,30],[35,25],[40,18],[42,12],[50,10],[48,5],[42,0],[40,-5],[35,-10],[30,-15],[28,-25],[25,-30],[20,-35],[15,-35],[12,-25],[10,-15],[8,-5],[5,5],[0,5],[-5,5],[-8,8],[-10,12],[-15,15],[-17,22],[-18,35]],
  'asia': [[30,30],[35,28],[40,25],[45,25],[50,25],[55,25],[60,25],[70,22],[80,22],[90,22],[100,22],[110,18],[120,18],[125,22],[130,28],[135,35],[140,40],[145,45],[140,50],[135,50],[130,50],[120,48],[110,48],[100,52],[90,55],[80,50],[70,50],[60,45],[50,45],[40,45],[30,40],[30,30]],
  'australia': [[115,-15],[125,-15],[135,-15],[145,-12],[150,-15],[155,-20],[150,-25],[145,-30],[135,-35],[130,-35],[115,-35],[113,-30],[113,-25],[115,-20],[115,-15]],
  'greenland': [[-55,60],[-48,60],[-42,62],[-38,68],[-40,74],[-45,78],[-50,82],[-55,82],[-60,80],[-65,78],[-68,74],[-65,68],[-60,64],[-55,60]],
};

function latLngToVec(lat, lng, radius) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lng + 180) * Math.PI / 180;
  return new THREE.Vector3(
    -radius * Math.sin(phi) * Math.cos(theta),
    radius * Math.cos(phi),
    radius * Math.sin(phi) * Math.sin(theta)
  );
}

function createContinentOutline(points, radius, subdivisions = 6) {
  const verts = [];
  for (let i = 0; i < points.length; i++) {
    const p1 = points[i];
    const p2 = points[(i + 1) % points.length];
    for (let j = 0; j < subdivisions; j++) {
      const t = j / subdivisions;
      const lat = p1[1] + (p2[1] - p1[1]) * t;
      const lng = p1[0] + (p2[0] - p1[0]) * t;
      const v = latLngToVec(lat, lng, radius);
      verts.push(v.x, v.y, v.z);
    }
  }
  return verts;
}

function buildContinentLines() {
  const allVerts = [];
  for (const name in CONTINENT_DATA) {
    const verts = createContinentOutline(CONTINENT_DATA[name], GLOBE_RADIUS * 1.0015);
    allVerts.push(...verts);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(allVerts, 3));
  const mat = new THREE.LineBasicMaterial({
    color: 0x1a2a4a,
    transparent: true,
    opacity: 0.35,
  });
  return new THREE.LineSegments(geo, mat);
}
globeGroup.add(buildContinentLines());

/* ── Atmosphere Glow ── */
const glowGeo = new THREE.SphereGeometry(GLOBE_RADIUS * 1.03, 48, 48);
const glowMat = new THREE.MeshPhongMaterial({
  color: 0x1133aa,
  emissive: 0x1122aa,
  emissiveIntensity: 0.15,
  transparent: true,
  opacity: 0.12,
  side: THREE.BackSide,
});
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
globeGroup.add(glowMesh);

const outerGlowGeo = new THREE.SphereGeometry(GLOBE_RADIUS * 1.08, 32, 32);
const outerGlowMat = new THREE.MeshBasicMaterial({
  color: 0x2244cc,
  transparent: true,
  opacity: 0.05,
  side: THREE.BackSide,
});
const outerGlowMesh = new THREE.Mesh(outerGlowGeo, outerGlowMat);
globeGroup.add(outerGlowMesh);

/* ── Starfield ── */
function createStars() {
  const count = 3000;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = 150 + Math.random() * 350;
    positions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.cos(phi);
    positions[i*3+2] = r * Math.sin(phi) * Math.sin(theta);
    const c = 0.4 + Math.random() * 0.6;
    colors[i*3] = c;
    colors[i*3+1] = c;
    colors[i*3+2] = c + Math.random() * 0.2;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({
    size: 0.15,
    vertexColors: true,
    transparent: true,
    opacity: 0.8,
    sizeAttenuation: true,
    blending: THREE.AdditiveBlending,
  });
  return new THREE.Points(geo, mat);
}
scene.add(createStars());

/* ── Attack Node Sprite Factory ── */
function makeNodeTexture(color, size = 64) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  const center = size / 2;
  const gradient = ctx.createRadialGradient(center, center, 0, center, center, center);
  gradient.addColorStop(0, color);
  gradient.addColorStop(0.2, color);
  gradient.addColorStop(0.5, color + '88');
  gradient.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(canvas);
}

const NODE_COLORS = {
  critical: '#FF1100',
  high: '#FF6600',
  medium: '#FFCC00',
  low: '#4488aa',
};

function createNodeSprite(data, radius) {
  const color = NODE_COLORS[data.severity] || '#FF6600';
  const tex = makeNodeTexture(color);
  const mat = new THREE.SpriteMaterial({
    map: tex,
    blending: THREE.AdditiveBlending,
    transparent: true,
    opacity: 0.9,
    depthWrite: false,
  });
  const sprite = new THREE.Sprite(mat);
  const pos = latLngToVec(data.lat, data.lng, radius);
  sprite.position.copy(pos);
  sprite.userData = { ...data, basePos: pos.clone(), phase: Math.random() * Math.PI * 2 };
  const baseScale = data.severity === 'critical' ? 0.35 : data.severity === 'high' ? 0.28 : 0.22;
  sprite.scale.set(baseScale, baseScale, 1);
  return sprite;
}

/* ── Attack System State ── */
const attacks = [];
const nodeSprites = [];
const connectionLines = [];
let attackCounter = 0;
let totalAttacksToday = 0;
let countryCounts = {};
let filteredSeverity = 'all';
let highlightedNodeId = null;
const logContainer = document.getElementById('log-entries');
let startTime = Date.now();
let lastLogTime = 0;

/* ── Helpers ── */
function randomIP() {
  const ranges = [
    [Math.floor(Math.random()*50)+180, Math.floor(Math.random()*256), Math.floor(Math.random()*256), Math.floor(Math.random()*256)],
    [Math.floor(Math.random()*50)+10, Math.floor(Math.random()*256), Math.floor(Math.random()*256), Math.floor(Math.random()*256)],
    [192, 168, Math.floor(Math.random()*256), Math.floor(Math.random()*256)],
  ];
  const r = ranges[Math.floor(Math.random() * ranges.length)];
  return r.join('.');
}

function randomLatLng() {
  const lat = Math.asin(2 * Math.random() - 1) * 180 / Math.PI;
  const lng = Math.random() * 360 - 180;
  return { lat: Math.round(lat * 10) / 10, lng: Math.round(lng * 10) / 10 };
}

function pickWeighted(obj) {
  const r = Math.random();
  let cum = 0;
  for (const [key, weight] of Object.entries(obj)) {
    cum += weight;
    if (r <= cum) return key;
  }
  return Object.keys(obj)[0];
}

function generateAttack() {
  const src = randomLatLng();
  const dst = randomLatLng();
  const severity = pickWeighted(SEV_WEIGHT);
  const attackType = ATTACK_TYPES[Math.floor(Math.random() * ATTACK_TYPES.length)];
  const country = COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)];
  const status = STATUSES[Math.floor(Math.random() * STATUSES.length)];
  return {
    id: ++attackCounter,
    timestamp: new Date(),
    sourceIP: randomIP(),
    targetIP: randomIP(),
    sourceLat: src.lat, sourceLng: src.lng,
    targetLat: dst.lat, targetLng: dst.lng,
    attackType,
    severity,
    country,
    status,
    port: Math.floor(Math.random() * 60000) + 1024,
  };
}

function greatCircleArc(p1, p2, radius, height = 0) {
  const v1 = latLngToVec(p1.lat, p1.lng, radius);
  const v2 = latLngToVec(p2.lat, p2.lng, radius);
  const pts = [];
  const segments = ARC_SEGMENTS;
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const v = v1.clone().lerp(v2, t).normalize();
    const arcHeight = Math.sin(t * Math.PI) * height;
    v.multiplyScalar(radius + arcHeight);
    pts.push(v);
  }
  return pts;
}

/* ── Create Connection Arc ── */
function createConnection(attack, arcHeight) {
  const pts = greatCircleArc(
    { lat: attack.sourceLat, lng: attack.sourceLng },
    { lat: attack.targetLat, lng: attack.targetLng },
    GLOBE_RADIUS,
    arcHeight || (0.4 + Math.random() * 0.6)
  );
  const positions = pts.flatMap(v => [v.x, v.y, v.z]);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.computeVertexNormals();

  const severity = attack.severity;
  const colorMap = { critical: 0xFF1100, high: 0xFF6600, medium: 0xFFCC00, low: 0x4488aa };
  const color = colorMap[severity] || 0xFF6600;
  const opacityMap = { critical: 0.45, high: 0.3, medium: 0.2, low: 0.1 };

  const mat = new THREE.LineDashedMaterial({
    color,
    transparent: true,
    opacity: opacityMap[severity] || 0.3,
    dashSize: 0.06,
    gapSize: 0.12,
    linewidth: 1,
    blending: THREE.AdditiveBlending,
  });
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  line.userData.attackId = attack.id;
  line.userData.dashOffset = 0;
  line.userData.severity = severity;

  /* Glow line underneath */
  const glowMat2 = new THREE.LineBasicMaterial({
    color,
    transparent: true,
    opacity: (opacityMap[severity] || 0.3) * 0.5,
    blending: THREE.AdditiveBlending,
  });
  const glowLine = new THREE.Line(geo.clone(), glowMat2);
  glowLine.scale.set(1, 1, 1);

  const group = new THREE.Group();
  group.add(glowLine);
  group.add(line);
  group.userData.attackId = attack.id;
  return group;
}

/* ── Spawn Attack ── */
function spawnAttack() {
  const attack = generateAttack();
  attacks.push(attack);
  totalAttacksToday++;

  /* Track countries */
  countryCounts[attack.country] = (countryCounts[attack.country] || 0) + 1;

  /* Source node */
  const srcNode = createNodeSprite({
    lat: attack.sourceLat,
    lng: attack.sourceLng,
    severity: attack.severity,
    ip: attack.sourceIP,
    port: attack.port,
    attackType: attack.attackType,
    status: attack.status,
    attackId: attack.id,
    isSource: true,
  }, GLOBE_RADIUS + NODE_BASE_HEIGHT);
  globeGroup.add(srcNode);
  nodeSprites.push(srcNode);

  /* Target node */
  const dstNode = createNodeSprite({
    lat: attack.targetLat,
    lng: attack.targetLng,
    severity: attack.severity,
    ip: attack.targetIP,
    port: attack.port,
    attackType: attack.attackType,
    status: attack.status,
    attackId: attack.id,
    isSource: false,
  }, GLOBE_RADIUS + NODE_BASE_HEIGHT);
  globeGroup.add(dstNode);
  nodeSprites.push(dstNode);

  /* Connection arc */
  const arc = createConnection(attack);
  globeGroup.add(arc);
  connectionLines.push(arc);

  /* Prune */
  while (nodeSprites.length > MAX_NODES * 2) {
    const old = nodeSprites.shift();
    globeGroup.remove(old);
    old.material.map.dispose();
    old.material.dispose();
  }
  while (connectionLines.length > MAX_CONNECTIONS) {
    const old = connectionLines.shift();
    globeGroup.remove(old);
    old.children.forEach(c => {
      if (c.geometry) c.geometry.dispose();
      if (c.material) c.material.dispose();
    });
  }

  appendLog(attack);
  updateStats();
  updateGlobalStats();
}

/* ── Log ── */
function appendLog(attack) {
  const now = attack.timestamp;
  const timeStr = now.toTimeString().slice(0, 8);
  const sevLabels = { critical: 'CRITICAL', high: 'HIGH', medium: 'MEDIUM', low: 'LOW' };

  /* Clear empty state */
  const empty = logContainer.querySelector('.log-empty');
  if (empty) empty.remove();

  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.dataset.severity = attack.severity;
  entry.innerHTML = `
    <span class="log-time">${timeStr}</span>
    <span class="log-ip">${attack.sourceIP}</span>
    <span class="log-type">${attack.attackType}</span>
    <span class="log-sev sev-${attack.severity}">${sevLabels[attack.severity]}</span>
  `;
  if (filteredSeverity !== 'all' && attack.severity !== filteredSeverity) {
    entry.style.display = 'none';
  }
  logContainer.appendChild(entry);

  while (logContainer.children.length > MAX_LOG_ENTRIES) {
    logContainer.removeChild(logContainer.firstChild);
  }
  logContainer.scrollTop = logContainer.scrollHeight;
}

/* ── Stats ── */
function updateStats() {
  document.getElementById('stat-total').textContent = totalAttacksToday;
  const active = attacks.filter(a => a.status === 'active' || a.status === 'investigating').length;
  document.getElementById('stat-active').textContent = active;

  let topCountry = '--';
  let maxCount = 0;
  for (const [country, count] of Object.entries(countryCounts)) {
    if (count > maxCount) { maxCount = count; topCountry = country; }
  }
  document.getElementById('stat-top-country').textContent = topCountry;

  const threatLevel = Math.min(100, Math.round(totalAttacksToday * 1.5 + active * 5));
  document.getElementById('stat-threat-level').textContent = threatLevel;
  document.getElementById('meter-fill').style.width = threatLevel + '%';
}

function updateGlobalStats() {
  const nodes = document.querySelectorAll('.node-count');
  document.getElementById('gs-nodes').textContent = nodeSprites.length;
  document.getElementById('gs-connections').textContent = connectionLines.length;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
  const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('gs-uptime').textContent = `${h}:${m}:${s}`;
}

/* ── Filter ── */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filteredSeverity = btn.dataset.filter;
    applyFilter();
  });
});

function applyFilter() {
  const entries = logContainer.querySelectorAll('.log-entry');
  entries.forEach(el => {
    const sev = el.dataset.severity;
    el.style.display = (filteredSeverity === 'all' || sev === filteredSeverity) ? '' : 'none';
  });
}

/* ── Tooltip ── */
const tooltipEl = document.getElementById('tooltip');
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredNode = null;

renderer.domElement.addEventListener('mousemove', (event) => {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(nodeSprites);

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    const d = obj.userData;
    tooltipEl.querySelector('#tt-ip').textContent = d.ip || '--';
    tooltipEl.querySelector('#tt-attack').textContent = d.attackType || '--';
    tooltipEl.querySelector('#tt-port').textContent = d.port || '--';
    tooltipEl.querySelector('#tt-status').textContent = d.status || '--';
    tooltipEl.style.left = (event.clientX + 14) + 'px';
    tooltipEl.style.top = (event.clientY - 10) + 'px';
    tooltipEl.classList.add('visible');
    renderer.domElement.style.cursor = 'pointer';
    hoveredNode = obj;
  } else {
    tooltipEl.classList.remove('visible');
    renderer.domElement.style.cursor = 'default';
    hoveredNode = null;
  }
});

renderer.domElement.addEventListener('mouseleave', () => {
  tooltipEl.classList.remove('visible');
  hoveredNode = null;
});

/* ── Click to Highlight ── */
renderer.domElement.addEventListener('click', () => {
  if (!hoveredNode) {
    clearHighlight();
    return;
  }
  const attackId = hoveredNode.userData.attackId;
  if (highlightedNodeId === attackId) {
    clearHighlight();
    return;
  }
  highlightedNodeId = attackId;
  applyHighlight(attackId);
});

function applyHighlight(id) {
  nodeSprites.forEach(sprite => {
    const isMatch = sprite.userData.attackId === id;
    sprite.material.opacity = isMatch ? 1 : 0.2;
  });
  connectionLines.forEach(line => {
    const isMatch = line.userData.attackId === id;
    line.children.forEach(child => {
      if (child.material) {
        child.material.opacity = isMatch ? (child.material.opacity * 2) : 0.04;
      }
    });
  });
}

function clearHighlight() {
  highlightedNodeId = null;
  nodeSprites.forEach(sprite => { sprite.material.opacity = 0.9; });
  connectionLines.forEach(line => {
    line.children.forEach(child => {
      if (child.material) {
        child.material.opacity = Math.min(child.material.opacity, 0.45);
      }
    });
  });
}

/* ── Resize ── */
window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

/* ── Startup Burst ── */
function startupBurst() {
  for (let i = 0; i < 8; i++) {
    setTimeout(() => spawnAttack(), i * 400);
  }
}
startupBurst();

/* ── Periodic Attack Spawner ── */
let spawnTimer = 0;
function scheduleNextSpawn() {
  const delay = 800 + Math.random() * 2200;
  spawnTimer = setTimeout(() => {
    spawnAttack();
    scheduleNextSpawn();
  }, delay);
}
scheduleNextSpawn();

/* ── Animation Loop ── */
let clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const elapsed = clock.getElapsedTime();

  /* Pulse nodes */
  nodeSprites.forEach((sprite, i) => {
    const d = sprite.userData;
    const pulse = 1 + 0.25 * Math.sin(elapsed * 2.5 + d.phase);
    const base = d.severity === 'critical' ? 0.35 : d.severity === 'high' ? 0.28 : 0.22;
    const s = base * pulse;
    sprite.scale.set(s, s, 1);
  });

  /* Animate connection dashes */
  connectionLines.forEach(line => {
    const dashLine = line.children[1];
    if (dashLine && dashLine.material && dashLine.material.isLineDashedMaterial) {
      dashLine.material.dashOffset += 0.015;
      dashLine.material.needsUpdate = true;
    }
  });

  controls.update();

  /* Overlay tooltip position adjustment */
  if (hoveredNode && tooltipEl.classList.contains('visible')) {
    const rect = renderer.domElement.getBoundingClientRect();
    const rightOverflow = parseFloat(tooltipEl.style.left) + tooltipEl.offsetWidth - rect.width;
    if (rightOverflow > 0) {
      tooltipEl.style.left = (parseFloat(tooltipEl.style.left) - tooltipEl.offsetWidth - 28) + 'px';
    }
    const bottomOverflow = parseFloat(tooltipEl.style.top) + tooltipEl.offsetHeight - rect.height;
    if (bottomOverflow > 0) {
      tooltipEl.style.top = (parseFloat(tooltipEl.style.top) - bottomOverflow - 5) + 'px';
    }
  }

  renderer.render(scene, camera);
}

animate();

/* ── Keyboard shortcuts ── */
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    controls.autoRotate = !controls.autoRotate;
  }
  if (e.key === 'c' || e.key === 'C') {
    clearHighlight();
  }
});

/* ── Periodic stats update ── */
setInterval(updateGlobalStats, 5000);

console.log('THREAT GLOBE initialized — monitoring global attack surface');
</script>
