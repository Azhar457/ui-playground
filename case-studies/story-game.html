<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>THREAT DRIFT — SOC Story Game</title>
<style>
  @font-face {
    font-family: 'Geist Mono';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url(./fonts/geist-mono.woff2) format('woff2');
  }
  :root{
    --bg:#0a0c10; --panel:rgba(8,10,22,.40); --line:rgba(140,160,255,.16);
    --ink:#eef1f8; --dim:#8b93a8; --cyan:#5ff; --pink:#ff4fd8; --amber:#ffb020;
    --mono:'Geist Mono', ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 80% at 85% -10%, rgba(255,79,216,.10), transparent 55%),
      radial-gradient(100% 70% at 0% 100%, rgba(95,255,255,.10), transparent 55%),
      var(--bg);
    color:var(--ink); font-family:var(--mono); -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1080px; margin:0 auto; padding:18px 18px 40px}
  header.bar{display:flex; align-items:center; justify-content:space-between; gap:14px; border-bottom:1px solid var(--line); padding-bottom:12px}
  .brand{font-weight:800; letter-spacing:.2em; text-transform:uppercase; font-size:.95rem}
  .brand b{color:var(--pink); text-shadow:0 0 18px rgba(255,79,216,.55)}
  .stats{display:flex; gap:10px}
  .panel{background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 14px; backdrop-filter:blur(3px)}
  .panel .v{font-size:18px; color:var(--ink)}
  .panel .v small{font-size:9px; color:var(--dim); margin-left:4px; letter-spacing:.1em}
  .panel .k{font-size:9px; letter-spacing:.24em; color:var(--dim); text-transform:uppercase; margin-top:2px}
  main{display:grid; grid-template-columns:1.15fr .85fr; gap:18px; margin-top:18px}
  @media (max-width:820px){ main{grid-template-columns:1fr} }
  .stage{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px; min-height:300px; display:flex; flex-direction:column; backdrop-filter:blur(3px)}
  .scene-tag{font-size:10px; letter-spacing:.52em; text-transform:uppercase; color:var(--cyan); margin-bottom:12px}
  .scene-title{font-size:1.5rem; font-weight:800; letter-spacing:-.01em; margin:0 0 14px; text-shadow:0 0 22px rgba(0,0,0,.85)}
  .scene-title .accent{color:var(--pink); text-shadow:0 0 24px rgba(255,79,216,.5)}
  .scene-body{font-size:.9rem; line-height:1.65; color:#cfd6e2; white-space:pre-wrap; flex:1}
  .choices{display:flex; flex-direction:column; gap:10px; margin-top:20px}
  .choice{position:relative; display:flex; flex-direction:column; gap:4px; text-align:left; padding:14px 16px 14px 34px; color:#aeb6cc; background:var(--panel); border:1px solid var(--line); border-radius:10px; cursor:pointer; font-family:var(--mono); font-size:.84rem; transition:color .16s, transform .16s, border-color .16s, box-shadow .16s; backdrop-filter:blur(3px)}
  .choice::before{content:''; position:absolute; left:0; top:50%; width:16px; height:1px; background:var(--cyan); opacity:.4; transform:scaleX(.3); transform-origin:left; transition:opacity .16s, transform .16s}
  .choice:hover{color:var(--ink); transform:translateX(8px); border-color:rgba(95,255,255,.4); box-shadow:0 0 22px rgba(95,255,255,.12)}
  .choice:hover::before{opacity:1; transform:scaleX(1)}
  .choice .k{font-size:10px; font-weight:300; letter-spacing:.3em; color:var(--pink); text-transform:uppercase}
  .globe-col{display:flex; flex-direction:column; gap:14px}
  .globe-wrap{position:relative; background:var(--panel); border:1px solid var(--line); border-radius:14px; overflow:hidden; height:300px; backdrop-filter:blur(3px)}
  #globe{width:100%; height:100%; display:block}
  .globe-cap{position:absolute; left:12px; top:10px; font-size:10px; letter-spacing:.4em; text-transform:uppercase; color:var(--cyan)}
  .threat{position:absolute; right:12px; top:10px; font-size:10px; letter-spacing:.2em; color:var(--cyan)}
  .log{background:rgba(3,5,10,.6); border:1px solid var(--line); border-radius:14px; padding:10px 12px; height:170px; overflow:auto; font-size:.68rem; line-height:1.7; color:#9aa3b4}
  .log .t{color:#4a5266} .log .ip{color:#c9d0dd} .log .ty{color:var(--amber)} .log .sv{color:var(--pink)}
  .log-empty{color:#39414f}
  footer.bar{margin-top:18px; display:flex; justify-content:space-between; align-items:center; font-size:.7rem; color:var(--dim); letter-spacing:.05em}
  footer.bar a{color:var(--cyan); text-decoration:none; border-bottom:1px dotted rgba(95,255,255,.5); letter-spacing:.12em; text-transform:uppercase}
  footer.bar a:hover{color:var(--ink)}
  .btn{cursor:pointer; border:1px solid var(--line); background:transparent; color:var(--ink); font-family:var(--mono); font-size:.72rem; padding:8px 14px; border-radius:8px; letter-spacing:.12em; text-transform:uppercase}
  .btn:hover{border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 14px rgba(95,255,255,.2)}
  .ending{position:fixed; inset:0; background:rgba(3,5,10,.96); display:none; align-items:center; justify-content:center; padding:24px; z-index:50}
  .ending.show{display:flex}
  .ending .card{background:var(--panel); border:1px solid var(--line); border-radius:16px; max-width:540px; width:100%; padding:30px; text-align:center; backdrop-filter:blur(6px)}
  .ending .rank{font-size:10px; letter-spacing:.4em; text-transform:uppercase; color:var(--cyan)}
  .ending h1{font-size:2rem; margin:8px 0 6px; letter-spacing:-.01em; text-shadow:0 0 26px rgba(0,0,0,.85)}
  .ending h1 .accent{color:var(--pink); text-shadow:0 0 24px rgba(255,79,216,.55)}
  .ending p{color:#c4ccdb; line-height:1.65; font-size:.9rem}
  .ending .score{font-size:2.4rem; font-weight:800; margin:14px 0 4px; text-shadow:0 0 18px rgba(95,255,255,.25)}
  .ending .chips{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:12px 0 18px}
  .chip{font-size:10px; letter-spacing:.12em; text-transform:uppercase; border:1px solid rgba(95,255,255,.4); color:var(--cyan); padding:4px 9px; border-radius:999px}
  .hintkey{font-size:.62rem; color:#4a5266; letter-spacing:.1em}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand">THREAT·<b>DRIFT</b></div>
    <div class="stats">
      <div class="panel"><div class="v" id="stScore">0</div><div class="k">Score</div></div>
      <div class="panel"><div class="v" id="stThreat">0</div><div class="k">Threat</div></div>
      <div class="panel"><div class="v" id="stStatus">NOMINAL</div><div class="k">Status</div></div>
    </div>
  </header>

  <main>
    <section class="stage">
      <div class="scene-tag" id="sceneTag">INCIDENT</div>
      <h1 class="scene-title" id="sceneTitle"></h1>
      <div class="scene-body" id="sceneBody"></div>
      <div class="choices" id="choices"></div>
    </section>

    <aside class="globe-col">
      <div class="globe-wrap">
        <canvas id="globe"></canvas>
        <div class="globe-cap">LIVE THREAT MAP</div>
        <div class="threat" id="globeThreat">●</div>
      </div>
      <div class="log" id="log"><div class="log-empty">menunggu telemetri ancaman…</div></div>
    </aside>
  </main>

  <footer class="bar">
    <span class="hintkey">Simpan otomatis di browser · pilihanmu membentuk ending</span>
    <span><a href="../index.html">← Playground</a> &nbsp;·&nbsp; <button class="btn" id="btnReset">Reset Run</button></span>
  </footer>
</div>

<div class="ending" id="ending">
  <div class="card">
    <div class="rank" id="endRank"></div>
    <h1 id="endTitle"></h1>
    <p id="endBlurb"></p>
    <div class="score" id="endScore">0</div>
    <div class="hintkey">SKOR AKHIR</div>
    <div class="chips" id="endChips"></div>
    <button class="btn" id="btnAgain">Main Lagi</button>
  </div>
</div>

<script>
/* ============================================================
   THREAT DRIFT — single-file branching SOC story game.
   Cyberpunk styling. Embedded vanilla-canvas globe (cyan/magenta).
   ============================================================ */

/* ---------- Embedded mini-globe (vanilla canvas) ---------- */
const Globe = (function () {
  const canvas = document.getElementById('globe');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, cx = 0, cy = 0, Rp = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = canvas.getBoundingClientRect();
    W = Math.max(2, Math.floor(r.width * DPR));
    H = Math.max(2, Math.floor(r.height * DPR));
    canvas.width = W; canvas.height = H;
    cx = W / 2; cy = H / 2;
    Rp = Math.min(W, H) * 0.34;
  }
  window.addEventListener('resize', resize);
  resize();

  const N = 720;
  const pts = [];
  const ga = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < N; i++) {
    const y = 1 - (i / (N - 1)) * 2;
    const r = Math.sqrt(1 - y * y);
    const th = ga * i;
    pts.push({ x: Math.cos(th) * r, y: y, z: Math.sin(th) * r, land: Math.random() < 0.18 });
  }

  const arcs = [];
  let ang = 0;

  function rotY(p, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return { x: p.x * c - p.z * s, y: p.y, z: p.x * s + p.z * c };
  }
  function proj(p) {
    const k = 260 / (260 - p.z * 120);
    return { x: cx + p.x * Rp * k, y: cy + p.y * Rp * k, z: p.z };
  }
  function randVec() {
    const u = Math.random() * 2 - 1;
    const t = Math.random() * Math.PI * 2;
    const r = Math.sqrt(1 - u * u);
    return { x: Math.cos(t) * r, y: u, z: Math.sin(t) * r };
  }
  function bezier(a, b, m, t) {
    const u = 1 - t;
    return {
      x: u * u * a.x + 2 * u * t * m.x + t * t * b.x,
      y: u * u * a.y + 2 * u * t * m.y + t * t * b.y,
      z: u * u * a.z + 2 * u * t * m.z + t * t * b.z
    };
  }

  function spawn(n) {
    n = n || 1;
    for (let i = 0; i < n; i++) {
      const a = randVec(), b = randVec();
      const m = { x: (a.x + b.x), y: (a.y + b.y) + 0.55, z: (a.z + b.z) };
      const ml = Math.hypot(m.x, m.y, m.z) || 1;
      arcs.push({ a, b, m: { x: m.x / ml, y: m.y / ml, z: m.z / ml }, t: 0, sp: 0.010 + Math.random() * 0.006 });
    }
  }

  function frame() {
    ang += 0.0016;
    ctx.clearRect(0, 0, W, H);
    // dots
    for (let i = 0; i < N; i++) {
      const p = rotY(pts[i], ang);
      const s = proj(p);
      const front = p.z > 0;
      const sz = (front ? 1.5 : 0.9) * DPR;
      if (pts[i].land) {
        ctx.fillStyle = front ? 'rgba(255,79,216,.9)' : 'rgba(255,79,216,.28)';
      } else {
        ctx.fillStyle = front ? 'rgba(95,255,255,.6)' : 'rgba(95,255,255,.16)';
      }
      ctx.fillRect(s.x - sz / 2, s.y - sz / 2, sz, sz);
    }
    // arcs
    for (let i = arcs.length - 1; i >= 0; i--) {
      const arc = arcs[i];
      arc.t += arc.sp;
      if (arc.t >= 1) { arcs.splice(i, 1); continue; }
      for (let s = 0; s <= 1; s += 0.05) {
        const pp = bezier(arc.a, arc.b, arc.m, arc.t * s);
        const rp = rotY(pp, ang);
        const sp = proj(rp);
        const al = (1 - s) * (1 - arc.t) * 0.9 + 0.05;
        ctx.fillStyle = 'rgba(255,79,216,' + al.toFixed(3) + ')';
        const sz = 2.2 * DPR;
        ctx.fillRect(sp.x - sz / 2, sp.y - sz / 2, sz, sz);
      }
      const head = rotY(bezier(arc.a, arc.b, arc.m, arc.t), ang);
      const hs = proj(head);
      ctx.save();
      ctx.shadowColor = 'rgba(255,79,216,.9)';
      ctx.shadowBlur = 8 * DPR;
      ctx.fillStyle = 'rgba(255,140,235,1)';
      const hs2 = 3 * DPR;
      ctx.fillRect(hs.x - hs2 / 2, hs.y - hs2 / 2, hs2, hs2);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  return { spawn: spawn };
})();

/* ---------- Threat log feed ---------- */
const logEl = document.getElementById('log');
const TYPES = ['PORT SCAN', 'EXFIL', 'BRUTE', 'C2 BEACON', 'LATERAL', 'DNS TUNNEL'];
const SEVS = ['CRIT', 'HIGH', 'MED', 'LOW'];
const STATUSES = ['BLOCKED', 'MITIGATED', 'ACTIVE', 'TRACED'];
function pushLog() {
  if (logEl.querySelector('.log-empty')) logEl.innerHTML = '';
  const ip = (10 + Math.floor(Math.random() * 240)) + '.' + Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255) + '.' + Math.floor(Math.random() * 255);
  const ty = TYPES[Math.floor(Math.random() * TYPES.length)];
  const sv = SEVS[Math.floor(Math.random() * SEVS.length)];
  const st = STATUSES[Math.floor(Math.random() * STATUSES.length)];
  const d = new Date();
  const ts = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
  const row = document.createElement('div');
  row.innerHTML = '<span class="t">' + ts + '</span> <span class="ip">' + ip + '</span> <span class="ty">' + ty + '</span> <span class="sv">' + sv + '</span> ' + st;
  logEl.appendChild(row);
  while (logEl.childElementCount > 9) logEl.removeChild(logEl.firstChild);
  logEl.scrollTop = logEl.scrollHeight;
}

/* ---------- Story engine ---------- */
const SCENES = {
  start: {
    tag: 'INCIDENT · 03:14',
    title: 'SIAGA',
    body: 'Alarm SOC berdering. Satu node di subnet OT menunjukkan eksfiltrasi data tersegmentasi. Kamu — analis hari pertama — duduk di meja. Telemetri belum jelas apakah ini satu node atau gerakan lebih luas.',
    choices: [
      { k: 'A', label: 'Isolasi node sekarang', to: 'isolate', effect: s => { s.score += 10; s.flags.cautious = true; } },
      { k: 'B', label: 'Selidiki dulu, jangan panik', to: 'investigate', effect: s => { s.flags.curious = true; } },
      { k: 'C', label: 'Escalasi ke senior', to: 'escalate', effect: s => { s.flags.bybook = true; } }
    ]
  },
  isolate: {
    tag: 'RESPON',
    title: 'KARANTINA',
    body: 'Node dikarantina. Tapi traffic aneh masih menyala di gateway utara. Ini bukan satu node — ini gerakan terkoordinasi yang berpindah saluran.',
    choices: [
      { k: 'A', label: 'Blokir gateway utara', to: 'block', effect: s => { s.score += 15; s.threat++; Globe.spawn(2); pushLog(); }, attack: true },
      { k: 'B', label: 'Biarkan, pelajari polanya', to: 'learn', effect: s => { s.flags.curious = (s.flags.curious || 0) + 1; } }
    ]
  },
  investigate: {
    tag: 'FORENSIK',
    title: 'STEGANOGRAFI',
    body: 'Kamu buka pcapt. Eksfiltrasi menyembunyikan payload di stream CCTV. Seseorang di dalam ikut bergerak — atau kredensialnya dicuri.',
    choices: [
      { k: 'A', label: 'Laporkan sebagai insider', to: 'insider', effect: s => { s.flags.integrity = true; } },
      { k: 'B', label: 'Ambil salinan diam-diam', to: 'copy', effect: s => { s.flags.rogue = true; } }
    ]
  },
  escalate: {
    tag: 'RADIO',
    title: 'RUNBOOK',
    body: 'Senior bilang ikuti runbook. Runbook minta isolasi total — tapi itu mematikan produksi pabrik selama berjam-jam. Tekanan di lehermu.',
    choices: [
      { k: 'A', label: 'Ikuti runbook (isolasi total)', to: 'total', effect: s => { s.flags.bybook = true; s.score += 5; } },
      { k: 'B', label: 'Negosiasi window 10 menit', to: 'window', effect: s => { s.flags.cautious = true; } }
    ]
  },
  block: {
    tag: 'RESPON',
    title: 'GATEWAY UTARA',
    body: 'Gateway utara diblokir. Traffic pindah ke selatan lewat VPN. Ada C2 tersembunyi yang belum kena. Waktu terus jalan.',
    choices: [
      { k: 'A', label: 'Hunt C2 di selatan', to: 'trace', effect: s => { s.score += 10; s.threat++; Globe.spawn(2); pushLog(); }, attack: true },
      { k: 'B', label: 'Anggap sudah selesai', to: 'relax', effect: s => { s.flags.bybook = true; } }
    ]
  },
  learn: {
    tag: 'FORENSIK',
    title: 'RANFSOM WAKTU',
    body: 'Polanya jelas: ini ransomware yang menunda detonasi. Timer internal menunjukkan 90 menit sebelum enkripsi menyebar.',
    choices: [
      { k: 'A', label: 'Siapkan kill-switch', to: 'contain', effect: s => { s.flags.curious = (s.flags.curious || 0) + 1; s.score += 15; } },
      { k: 'B', label: 'Tunggu konfirmasi atasan', to: 'wait', effect: s => { s.flags.cautious = true; } }
    ]
  },
  insider: {
    tag: 'FORENSIK',
    title: 'KREDENSIAL',
    body: 'Log menunjukkan kredensial senior dipakai pukul 02:00. Bukan dia — kredensial dicuri lewat phishing. Jejak menuju server luar.',
    choices: [
      { k: 'A', label: 'Reset kredensial + laporkan', to: 'trace', effect: s => { s.flags.integrity = true; s.score += 10; } },
      { k: 'B', label: 'Sembunyikan buat bobol sendiri', to: 'copy', effect: s => { s.flags.rogue = true; } }
    ]
  },
  copy: {
    tag: 'BAYANGAN',
    title: 'SALINAN',
    body: 'Kamu simpan salinan bukti. Tapi sandbox mulai menyebar ke DB pelanggan. Garis antara investigasi dan kerusakan jadi tipis.',
    choices: [
      { k: 'A', label: 'Hapus salinan, laporkan', to: 'trace', effect: s => { s.flags.integrity = true; s.score += 5; s.threat++; Globe.spawn(1); pushLog(); }, attack: true },
      { k: 'B', label: 'Biarkan, ini bukti', to: 'rogue_path', effect: s => { s.flags.rogue = true; s.threat++; Globe.spawn(2); pushLog(); }, attack: true }
    ]
  },
  total: {
    tag: 'DAMPAK',
    title: 'ISOLASI TOTAL',
    body: 'Produksi pabrik mati 4 jam. Eksfiltrasi berhenti. Tapi karena jaringan dikunci, investigasi sumber ikut terhenti. Senyap, tapi buta.',
    choices: [
      { k: 'A', label: 'Rebuild + hunt pasca-insiden', to: 'sentinel', effect: s => { s.flags.bybook = true; s.score += 20; } }
    ]
  },
  window: {
    tag: 'NEGOSIASI',
    title: 'WINDOW 10 MENIT',
    body: 'Tim dapat window. Dalam 10 menit mereka menemukan C2 diiringi kredensial insider. Waktu habis — keputusan harus diambil sekarang.',
    choices: [
      { k: 'A', label: 'Tangkap insider + blokir C2', to: 'trace', effect: s => { s.flags.bybook = true; s.flags.integrity = true; s.score += 20; s.threat++; Globe.spawn(2); pushLog(); }, attack: true },
      { k: 'B', label: 'Biarkan mengendap, amati', to: 'rogue_path', effect: s => { s.flags.rogue = true; } }
    ]
  },
  trace: {
    tag: 'HUNT',
    title: 'SERVER C2',
    body: 'Pelacakan menemukan server C2 di luar negeri. Koneksi diputus, IO yang sempat diambil dikirim ke tim mitigasi. Loop hampir tertutup.',
    choices: [
      { k: 'A', label: 'Tutup loop, dokumentasi bersih', to: 'sentinel', effect: s => { s.score += 20; s.flags.integrity = true; } },
      { k: 'B', label: 'Masuk lebih dalam (off-script)', to: 'ghost_path', effect: s => { s.flags.rogue = true; s.flags.curious = (s.flags.curious || 0) + 1; s.threat++; Globe.spawn(2); pushLog(); }, attack: true }
    ]
  },
  contain: {
    tag: 'KILL-SWITCH',
    title: '30 DETIK',
    body: 'Kill-switch aktif 30 detik sebelum detonasi. Jaringan selamat. Tapi operator di balik ini belum teridentifikasi.',
    choices: [
      { k: 'A', label: 'Forensik rutin', to: 'sentinel', effect: s => { s.score += 15; s.flags.bybook = true; } },
      { k: 'B', label: 'Hack-back ke operator', to: 'ghost_path', effect: s => { s.flags.rogue = true; s.threat++; Globe.spawn(2); pushLog(); }, attack: true }
    ]
  },
  wait: {
    tag: 'TUNDUH',
    title: 'TERLAMBAT',
    body: 'Konfirmasi datang terlambat. Detonasi parsial di 3 node. Kerugian terbatas, tapi audit akan bertanya.',
    choices: [
      { k: 'A', label: 'Contain + lapor transparan', to: 'sentinel', effect: s => { s.score += 5; s.flags.integrity = true; } },
      { k: 'B', label: 'Tutup mata', to: 'breach', effect: s => { s.flags.rogue = true; s.threat += 2; Globe.spawn(3); pushLog(); }, attack: true }
    ]
  },
  relax: {
    tag: 'ILUSI',
    title: 'TENANG PALSU',
    body: 'Kamu anggap selesai. Tapi malam itu, seluruh subnet OT mulai mengenkripsi diam-diam. Ketika alarm kembali, terlambat.',
    choices: [
      { k: 'A', label: 'Coba pulihkan darurat', to: 'breach', effect: s => { s.threat += 2; Globe.spawn(3); pushLog(); }, attack: true }
    ]
  },
  rogue_path: {
    tag: 'BAYANGAN',
    title: 'BATAS',
    body: 'Kamu main di batas. Informasi berharga dikantongi, tapi audit trail mulai merah. Seseorang di tim keamanan mulai curiga.',
    choices: [
      { k: 'A', label: 'Tutup semuanya, lapor bersih', to: 'rogue', effect: s => { s.flags.rogue = true; } },
      { k: 'B', label: 'Lanjut ke inti operator', to: 'ghost_path', effect: s => { s.flags.rogue = true; s.threat++; Globe.spawn(2); pushLog(); }, attack: true }
    ]
  },
  ghost_path: {
    tag: 'INTI',
    title: 'BUKAN KRIMINAL',
    body: 'Di inti, kamu temukan ini bukan kriminal biasa — sebuah APT negara yang menyamar sebagai ransomware. Bukti cukup untuk menghentikan kampanye global.',
    choices: [
      { k: 'A', label: 'Bocorkan bukti (whistleblow)', to: 'ghost', effect: s => { s.flags.integrity = true; s.flags.curious = (s.flags.curious || 0) + 1; s.score += 30; } },
      { k: 'B', label: 'Jual ke pengambil keuntungan', to: 'rogue', effect: s => { s.flags.rogue = true; s.threat++; Globe.spawn(2); pushLog(); }, attack: true },
      { k: 'C', label: 'Serahkan ke otoritas diam-diam', to: 'sentinel', effect: s => { s.score += 25; s.flags.integrity = true; } }
    ]
  },
  /* ---- endings ---- */
  sentinel: { ending: true, key: 'sentinel',
    title: 'IRON SENTINEL',
    blurb: 'Kamu mengikuti prosedur, menahan panik, dan menutup insiden dengan dokumentasi bersih. Tidak heroik, tapi jaringan utuh dan tim percaya padamu. Shift berikutnya meneruskan dengan tenang.' },
  rogue: { ending: true, key: 'rogue',
    title: 'ROGUE ANALYST',
    blurb: 'Kamu main di batas dan keluar dengan data, tapi jejak merah tertinggal. Operasi terselamatkan sebagian, kariermu di ambang. Beberapa malam kamu masih membuka log itu sendirian.' },
  breach: { ending: true, key: 'breach',
    title: 'BREACHED',
    blurb: 'Eksfiltrasi selesai sebelum kamu menutup celah. Nama perusahaan besok ada di headline. Ini akhir terburuk — pelajaran mahal tentang menunggu konfirmasi.' },
  ghost: { ending: true, key: 'ghost',
    title: 'GHOST IN THE WIRE',
    blurb: 'Kamu membongkar kedok APT dan menghentikan kampanye global lewat bukti yang tak bisa dibantah. Tak ada yang tahu siapa dirimu. Legenda sunyi di antara analis.' }
};

/* ---------- State + persistence ---------- */
const KEY = 'threatdrift_save_v1';
function fresh() { return { score: 0, flags: {}, threat: 0, scene: 'start' }; }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.scene) return s; } catch (e) {} return null; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

let state = load() || fresh();

const elTag = document.getElementById('sceneTag');
const elTitle = document.getElementById('sceneTitle');
const elBody = document.getElementById('sceneBody');
const elChoices = document.getElementById('choices');
const stScore = document.getElementById('stScore');
const stThreat = document.getElementById('stThreat');
const stStatus = document.getElementById('stStatus');
const globeThreat = document.getElementById('globeThreat');

function updateStats() {
  stScore.textContent = state.score;
  stThreat.textContent = state.threat;
  let status = 'NOMINAL', col = 'var(--cyan)';
  if (state.threat >= 4) { status = 'CRITICAL'; col = '#ff2a6a'; }
  else if (state.threat >= 2) { status = 'ELEVATED'; col = 'var(--amber)'; }
  stStatus.textContent = status;
  stStatus.style.color = col;
  stThreat.style.color = col;
  globeThreat.style.color = col;
}

function render() {
  const sc = SCENES[state.scene];
  if (sc.ending) { showEnding(sc); save(); return; }
  elTag.textContent = sc.tag;
  elTitle.textContent = sc.title;
  elBody.textContent = sc.body;
  elChoices.innerHTML = '';
  sc.choices.forEach(ch => {
    const b = document.createElement('button');
    b.className = 'choice';
    b.innerHTML = '<span class="k">' + (ch.k || '·') + '</span>' + ch.label;
    b.addEventListener('click', () => {
      if (ch.effect) ch.effect(state);
      if (ch.attack) Globe.spawn(2);
      state.scene = ch.to;
      updateStats();
      save();
      render();
    });
    elChoices.appendChild(b);
  });
  updateStats();
}

function showEnding(sc) {
  const endEl = document.getElementById('ending');
  document.getElementById('endRank').textContent = 'ENDING · ' + sc.key.toUpperCase();
  document.getElementById('endTitle').innerHTML = sc.title.split(' ').map((w,i)=>i===1?'<span class="accent">'+w+'</span>':w).join(' ');
  document.getElementById('endBlurb').textContent = sc.blurb;
  document.getElementById('endScore').textContent = state.score;
  const chips = document.getElementById('endChips');
  chips.innerHTML = '';
  const f = state.flags;
  const labels = [];
  if (f.bybook) labels.push('BY-THE-BOOK');
  if (f.cautious) labels.push('CAUTIOUS');
  if (f.curious) labels.push('CURIOUS');
  if (f.integrity) labels.push('INTEGRITY');
  if (f.rogue) labels.push('ROGUE');
  if (!labels.length) labels.push('UNSCRIBED');
  labels.forEach(l => {
    const c = document.createElement('span'); c.className = 'chip'; c.textContent = l; chips.appendChild(c);
  });
  endEl.classList.add('show');
}

document.getElementById('btnAgain').addEventListener('click', () => {
  document.getElementById('ending').classList.remove('show');
  reset();
});
document.getElementById('btnReset').addEventListener('click', reset);
function reset() { state = fresh(); logEl.innerHTML = '<div class="log-empty">menunggu telemetri ancaman…</div>'; save(); render(); }

render();
</script>
</body>
</html>
