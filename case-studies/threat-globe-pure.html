<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THREAT GLOBE — Live Cyber Attack Map (Pure)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#ccc;font-family:ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;overflow:hidden;height:100vh;width:100vw}
#globe-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;display:block}

#top-bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:linear-gradient(180deg,rgba(10,10,15,.95) 0%,rgba(10,10,15,.7) 60%,transparent 100%);pointer-events:auto;flex-wrap:wrap;gap:8px}

#tooltip{position:absolute;background:rgba(10,10,15,.92);border:1px solid rgba(255,42,28,.3);border-radius:4px;padding:8px 10px;font-family:ui-monospace,Menlo,Consolas,"Liberation Mono",monospace;font-size:11px;pointer-events:none;opacity:0;transition:opacity .15s;z-index:100;min-width:140px;box-shadow:0 4px 20px rgba(0,0,0,.6)}

#global-stats .gs-value{color:#888}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){#side-panel{width:260px;right:8px;top:110px;max-height:calc(100vh - 120px)}#top-bar{padding:8px 12px;flex-direction:column;align-items:flex-start}#top-bar h1{font-size:14px}.stats-row{gap:10px}.stat{min-width:50px}.stat-value{font-size:13px}#global-stats{display:none}}
</style>

<body>

<canvas id="globe-canvas"></canvas>

<div id="ui-overlay">
  <div id="top-bar">
    <h1>THREAT<span>GLOBE</span></h1>
    <div class="stats-row">
      <div class="stat">
        <span class="stat-label">Total Today</span>
        <span class="stat-value danger" id="stat-total">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Active Threats</span>
        <span class="stat-value warning" id="stat-active">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Top Source</span>
        <span class="stat-value" id="stat-top-country" style="color:#ffcc00;font-size:13px">--</span>
      </div>
      <div id="threat-meter">
        <span class="stat-label">Threat Level</span>
        <span class="stat-value" id="stat-threat-level" style="color:#fff">0</span>
        <div class="meter-bar"><div class="meter-fill" id="meter-fill"></div></div>
      </div>
    </div>
  </div>

  <div id="side-panel">
    <div id="log-panel">
      <div id="log-header">
        <h2>Live Attack Log</h2>
        <div id="log-filters">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="critical">Critical</button>
          <button class="filter-btn" data-filter="high">High</button>
          <button class="filter-btn" data-filter="medium">Med</button>
        </div>
      </div>
      <div id="log-entries"><div class="log-empty">Awaiting threat data...</div></div>
    </div>
  </div>

  <div id="tooltip">
    <div class="tt-label">IP</div>
    <div class="tt-value" id="tt-ip">--</div>
    <div class="tt-label">Attack</div>
    <div class="tt-value" id="tt-attack">--</div>
    <div class="tt-label">Port</div>
    <div class="tt-value" id="tt-port">--</div>
    <div class="tt-label">Status</div>
    <div class="tt-value" id="tt-status">--</div>
  </div>

  <div id="global-stats">
    <span>NODES: <span class="gs-value" id="gs-nodes">0</span></span>
    <span>CONNECTIONS: <span class="gs-value" id="gs-connections">0</span></span>
    <span>UPTIME: <span class="gs-value" id="gs-uptime">00:00:00</span></span>
  </div>
</div>

<script>
"use strict";

/* ── Config ── */
const GLOBE_RADIUS = 1;            // unit sphere for math; pixels scaled at render
const NODE_BASE_HEIGHT = 0.02;
const ARC_SEGMENTS = 48;
const MAX_LOG_ENTRIES = 200;
const MAX_NODES = 60;
const MAX_CONNECTIONS = 80;
const BASE_DOTS = 820;
const LAND_SAMPLES = 900;

/* Reused conceptual data from the reference (no external deps) */
const ATTACK_TYPES = [
  'DDoS','SQL Injection','XSS','Brute Force','Malware','Ransomware',
  'DNS Spoofing','MITM','Zero-Day Exploit','Port Scan','Credential Stuffing',
  'Phishing','Buffer Overflow','APT Intrusion','Replay Attack','LDAP Injection'
];

const COUNTRIES = [
  'USA','CHN','RUS','PRK','IRN','BRA','IND','DEU','GBR','NGA','KOR','JPN',
  'VIE','IDN','MEX','ZAF','TUR','SAU','ISR','UKR'
];

const SEVERITIES = ['critical','high','medium','low'];
const SEV_WEIGHT = { critical: 0.15, high: 0.3, medium: 0.35, low: 0.2 };
const STATUSES = ['blocked','mitigated','active','investigating'];

const NODE_COLORS = {
  critical: '#ff2a1c',
  high: '#ff6600',
  medium: '#ffcc00',
  low: '#4488aa',
};

/* Continent outline polygons [lng, lat] — same source data as the reference */
const CONTINENT_DATA = {
  'north-america': [[-130,20],[-110,22],[-100,18],[-90,18],[-85,22],[-80,28],[-75,35],[-70,42],[-65,47],[-68,50],[-75,55],[-80,62],[-90,67],[-100,72],[-120,72],[-130,68],[-145,62],[-150,55],[-130,52],[-125,42],[-128,32],[-130,20]],
  'south-america': [[-80,10],[-75,5],[-60,5],[-50,5],[-35,0],[-35,-7],[-37,-15],[-40,-22],[-45,-25],[-50,-30],[-55,-35],[-60,-40],[-65,-46],[-70,-52],[-74,-52],[-74,-46],[-70,-30],[-73,-18],[-80,-8],[-80,10]],
  'europe': [[-10,36],[0,38],[5,42],[10,44],[15,42],[20,40],[25,40],[28,42],[30,45],[28,48],[25,50],[20,54],[15,56],[10,58],[5,60],[0,58],[-5,55],[-10,50],[-10,44],[-10,36]],
  'africa': [[-18,35],[-10,35],[-5,30],[0,30],[10,30],[12,33],[30,32],[33,30],[35,25],[40,18],[42,12],[50,10],[48,5],[42,0],[40,-5],[35,-10],[30,-15],[28,-25],[25,-30],[20,-35],[15,-35],[12,-25],[10,-15],[8,-5],[5,5],[0,5],[-5,5],[-8,8],[-10,12],[-15,15],[-17,22],[-18,35]],
  'asia': [[30,30],[35,28],[40,25],[45,25],[50,25],[55,25],[60,25],[70,22],[80,22],[90,22],[100,22],[110,18],[120,18],[125,22],[130,28],[135,35],[140,40],[145,45],[140,50],[135,50],[130,50],[120,48],[110,48],[100,52],[90,55],[80,50],[70,50],[60,45],[50,45],[40,45],[30,40],[30,30]],
  'australia': [[115,-15],[125,-15],[135,-15],[145,-12],[150,-15],[155,-20],[150,-25],[145,-30],[135,-35],[130,-35],[115,-35],[113,-30],[113,-25],[115,-20],[115,-15]],
  'greenland': [[-55,60],[-48,60],[-42,62],[-38,68],[-40,74],[-45,78],[-50,82],[-55,82],[-60,80],[-65,78],[-68,74],[-65,68],[-60,64],[-55,60]],
};

/* ── Math helpers ── */
function latLngToVec3(lat, lng, radius) {
  const phi = (90 - lat) * Math.PI / 180;
  const theta = (lng + 180) * Math.PI / 180;
  return {
    x: -radius * Math.sin(phi) * Math.cos(theta),
    y:  radius * Math.cos(phi),
    z:  radius * Math.sin(phi) * Math.sin(theta),
  };
}

function rand(a, b) { return a + Math.random() * (b - a); }

/* Point-in-polygon (ray casting) for [lng,lat] */
function pointInPolygon(lng, lat, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const xi = poly[i][0], yi = poly[i][1];
    const xj = poly[j][0], yj = poly[j][1];
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lng < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

/* ── Build globe point cloud (dot-sphere) ── */
const globePoints = [];   // {x,y,z, land:bool}

/* Fibonacci sphere of base (ocean) dots */
(function buildBaseDots() {
  const n = BASE_DOTS;
  const golden = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2;
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = golden * i;
    globePoints.push({
      x: Math.cos(theta) * r,
      y: y,
      z: Math.sin(theta) * r,
      land: false,
    });
  }
})();

/* Sample continent polygons to produce brighter "land" points */
(function buildLandDots() {
  const polys = Object.values(CONTINENT_DATA);
  let placed = 0, guard = 0;
  while (placed < LAND_SAMPLES && guard < LAND_SAMPLES * 40) {
    guard++;
    const poly = polys[Math.floor(Math.random() * polys.length)];
    let minLng = 180, maxLng = -180, minLat = 90, maxLat = -90;
    for (const p of poly) {
      if (p[0] < minLng) minLng = p[0];
      if (p[0] > maxLng) maxLng = p[0];
      if (p[1] < minLat) minLat = p[1];
      if (p[1] > maxLat) maxLat = p[1];
    }
    const lng = rand(minLng, maxLng);
    const lat = rand(minLat, maxLat);
    if (pointInPolygon(lng, lat, poly)) {
      const v = latLngToVec3(lat, lng, GLOBE_RADIUS);
      globePoints.push({ x: v.x, y: v.y, z: v.z, land: true });
      placed++;
    }
  }
})();

/* ── Attack system state ── */
const attacks = [];
const nodeSprites = [];   // {lat,lng,severity,ip,port,attackType,status,attackId,isSource,phase}
const connectionArcs = []; // {p1,p2 (unit vec), t, speed, severity, attackId, life}
let attackCounter = 0;
let totalAttacksToday = 0;
let countryCounts = {};
let filteredSeverity = 'all';
let highlightedNodeId = null;
const logContainer = document.getElementById('log-entries');
const startTime = Date.now();

/* ── Attack generation (reused shapes) ── */
function randomIP() {
  const ranges = [
    [Math.floor(Math.random()*50)+180, Math.floor(Math.random()*256), Math.floor(Math.random()*256), Math.floor(Math.random()*256)],
    [Math.floor(Math.random()*50)+10, Math.floor(Math.random()*256), Math.floor(Math.random()*256), Math.floor(Math.random()*256)],
    [192, 168, Math.floor(Math.random()*256), Math.floor(Math.random()*256)],
  ];
  return ranges[Math.floor(Math.random() * ranges.length)].join('.');
}

function randomLatLng() {
  const lat = Math.asin(2 * Math.random() - 1) * 180 / Math.PI;
  const lng = Math.random() * 360 - 180;
  return { lat: Math.round(lat * 10) / 10, lng: Math.round(lng * 10) / 10 };
}

function pickWeighted(obj) {
  const r = Math.random();
  let cum = 0;
  for (const k in obj) {
    cum += obj[k];
    if (r <= cum) return k;
  }
  return Object.keys(obj)[0];
}

function generateAttack() {
  const src = randomLatLng();
  const dst = randomLatLng();
  const severity = pickWeighted(SEV_WEIGHT);
  return {
    id: ++attackCounter,
    timestamp: new Date(),
    sourceIP: randomIP(),
    targetIP: randomIP(),
    sourceLat: src.lat, sourceLng: src.lng,
    targetLat: dst.lat, targetLng: dst.lng,
    attackType: ATTACK_TYPES[Math.floor(Math.random() * ATTACK_TYPES.length)],
    severity,
    country: COUNTRIES[Math.floor(Math.random() * COUNTRIES.length)],
    status: STATUSES[Math.floor(Math.random() * STATUSES.length)],
    port: Math.floor(Math.random() * 60000) + 1024,
  };
}

/* Great-circle arc between two unit vectors (slerp), lifted off the surface */
function buildArcPoints(p1, p2, segments, height) {
  const dot = Math.max(-1, Math.min(1, p1.x*p2.x + p1.y*p2.y + p1.z*p2.z));
  const omega = Math.acos(dot);
  const sinO = Math.sin(omega) || 1e-6;
  const pts = [];
  for (let i = 0; i <= segments; i++) {
    const t = i / segments;
    const a = Math.sin((1 - t) * omega) / sinO;
    const b = Math.sin(t * omega) / sinO;
    const lift = Math.sin(t * Math.PI) * height;
    const r = GLOBE_RADIUS + lift;
    pts.push({
      x: (a * p1.x + b * p2.x) * r,
      y: (a * p1.y + b * p2.y) * r,
      z: (a * p1.z + b * p2.z) * r,
    });
  }
  return pts;
}

/* ── Spawn attack ── */
function spawnAttack() {
  const attack = generateAttack();
  attacks.push(attack);
  totalAttacksToday++;

  countryCounts[attack.country] = (countryCounts[attack.country] || 0) + 1;

  const p1 = latLngToVec3(attack.sourceLat, attack.sourceLng, GLOBE_RADIUS + NODE_BASE_HEIGHT);
  const p2 = latLngToVec3(attack.targetLat, attack.targetLng, GLOBE_RADIUS + NODE_BASE_HEIGHT);

  nodeSprites.push({ lat: attack.sourceLat, lng: attack.sourceLng, pos: p1, severity: attack.severity, ip: attack.sourceIP, port: attack.port, attackType: attack.attackType, status: attack.status, attackId: attack.id, isSource: true, phase: Math.random() * Math.PI * 2 });
  nodeSprites.push({ lat: attack.targetLat, lng: attack.targetLng, pos: p2, severity: attack.severity, ip: attack.targetIP, port: attack.port, attackType: attack.attackType, status: attack.status, attackId: attack.id, isSource: false, phase: Math.random() * Math.PI * 2 });

  connectionArcs.push({
    p1, p2,
    t: 0,
    speed: 0.006 + Math.random() * 0.01,
    severity: attack.severity,
    attackId: attack.id,
    life: 1,
  });

  while (nodeSprites.length > MAX_NODES * 2) nodeSprites.shift();
  while (connectionArcs.length > MAX_CONNECTIONS) connectionArcs.shift();

  appendLog(attack);
  updateStats();
  updateGlobalStats();
}

/* ── Log ── */
function appendLog(attack) {
  const timeStr = attack.timestamp.toTimeString().slice(0, 8);
  const sevLabels = { critical: 'CRITICAL', high: 'HIGH', medium: 'MEDIUM', low: 'LOW' };
  const empty = logContainer.querySelector('.log-empty');
  if (empty) empty.remove();

  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.dataset.severity = attack.severity;
  entry.innerHTML =
    '<span class="log-time">' + timeStr + '</span>' +
    '<span class="log-ip">' + attack.sourceIP + '</span>' +
    '<span class="log-type">' + attack.attackType + '</span>' +
    '<span class="log-sev sev-' + attack.severity + '">' + sevLabels[attack.severity] + '</span>';
  if (filteredSeverity !== 'all' && attack.severity !== filteredSeverity) entry.style.display = 'none';
  logContainer.appendChild(entry);

  while (logContainer.children.length > MAX_LOG_ENTRIES) {
    logContainer.removeChild(logContainer.firstChild);
  }
  logContainer.scrollTop = logContainer.scrollHeight;
}

/* ── Stats ── */
function updateStats() {
  document.getElementById('stat-total').textContent = totalAttacksToday;
  const active = attacks.filter(a => a.status === 'active' || a.status === 'investigating').length;
  document.getElementById('stat-active').textContent = active;

  let topCountry = '--', maxCount = 0;
  for (const c in countryCounts) {
    if (countryCounts[c] > maxCount) { maxCount = countryCounts[c]; topCountry = c; }
  }
  document.getElementById('stat-top-country').textContent = topCountry;

  const threatLevel = Math.min(100, Math.round(totalAttacksToday * 1.5 + active * 5));
  document.getElementById('stat-threat-level').textContent = threatLevel;
  document.getElementById('meter-fill').style.width = threatLevel + '%';
}

function updateGlobalStats() {
  document.getElementById('gs-nodes').textContent = nodeSprites.length;
  document.getElementById('gs-connections').textContent = connectionArcs.length;
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
  const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
  const s = String(elapsed % 60).padStart(2, '0');
  document.getElementById('gs-uptime').textContent = h + ':' + m + ':' + s;
}

/* ── Filter ── */
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filteredSeverity = btn.dataset.filter;
    const entries = logContainer.querySelectorAll('.log-entry');
    entries.forEach(el => {
      const sev = el.dataset.severity;
      el.style.display = (filteredSeverity === 'all' || sev === filteredSeverity) ? '' : 'none';
    });
  });
});

/* ── Canvas setup ── */
const canvas = document.getElementById('globe-canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, globePx = 0;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = W * 0.5;
  cy = H * 0.5;
  globePx = Math.min(W, H) * 0.36;
}
window.addEventListener('resize', resize);
resize();

/* ── Rotation state ── */
let rotY = 0;
let autoRotate = true;
const TILT = -0.41; // ~ -23.5deg fixed axial tilt on X

function rotateY(v, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return { x: v.x * c + v.z * s, y: v.y, z: -v.x * s + v.z * c };
}
function rotateX(v, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return { x: v.x, y: v.y * c - v.z * s, z: v.y * s + v.z * c };
}
function transform(v) {
  return rotateX(rotateY(v, rotY), TILT);
}

/* Project a unit-space point (already rotated) to screen */
function project(p) {
  const persp = 1 / (1 - p.z * 0.45); // p.z in [-1,1]; front (z>0) larger
  return {
    sx: cx + p.x * globePx * persp,
    sy: cy - p.y * globePx * persp,
    scale: persp,
    z: p.z,
  };
}

/* ── Starfield (static-ish, drawn each frame) ── */
const stars = [];
for (let i = 0; i < 360; i++) {
  stars.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.3 + 0.2, a: Math.random() * 0.6 + 0.2 });
}

/* ── Tooltip / picking ── */
const tooltipEl = document.getElementById('tooltip');
let mouseX = -1, mouseY = -1, mouseInside = false;
let hoveredNode = null;

canvas.addEventListener('mousemove', (e) => {
  mouseX = e.clientX; mouseY = e.clientY; mouseInside = true;
});
canvas.addEventListener('mouseleave', () => { mouseInside = false; tooltipEl.classList.remove('visible'); hoveredNode = null; });
canvas.addEventListener('click', () => {
  if (!hoveredNode) { highlightedNodeId = null; return; }
  highlightedNodeId = (highlightedNodeId === hoveredNode.attackId) ? null : hoveredNode.attackId;
});

/* ── Render loop ── */
let lastT = performance.now();

function frame(now) {
  const dt = Math.min(50, now - lastT);
  lastT = now;

  if (autoRotate) rotY += 0.0025 * (dt / 16.6667);

  ctx.clearRect(0, 0, W, H);

  /* background stars */
  for (const st of stars) {
    ctx.globalAlpha = st.a;
    ctx.fillStyle = '#aab4ff';
    ctx.fillRect(st.x * W, st.y * H, st.r, st.r);
  }
  ctx.globalAlpha = 1;

  /* atmosphere glow */
  const glowR = globePx * 1.25;
  const g = ctx.createRadialGradient(cx, cy, globePx * 0.7, cx, cy, glowR);
  g.addColorStop(0, 'rgba(40,80,200,0.10)');
  g.addColorStop(0.6, 'rgba(30,50,140,0.06)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
  ctx.fill();

  /* globe base sphere fill (subtle) */
  const core = ctx.createRadialGradient(cx - globePx*0.3, cy - globePx*0.3, globePx*0.1, cx, cy, globePx);
  core.addColorStop(0, 'rgba(18,22,46,0.55)');
  core.addColorStop(1, 'rgba(8,8,18,0.85)');
  ctx.fillStyle = core;
  ctx.beginPath();
  ctx.arc(cx, cy, globePx, 0, Math.PI * 2);
  ctx.fill();

  /* draw dots — split into front/back by z for proper dimming */
  for (let i = 0; i < globePoints.length; i++) {
    const p = transform(globePoints[i]);
    const pr = project(p);
    const front = p.z > 0;
    const depthAlpha = 0.25 + (p.z + 1) / 2 * 0.75; // 0.25 (back) .. 1 (front)
    if (globePoints[i].land) {
      ctx.fillStyle = front ? 'rgba(120,160,255,' + (depthAlpha * 0.9).toFixed(3) + ')'
                            : 'rgba(70,95,170,' + (depthAlpha * 0.5).toFixed(3) + ')';
      const r = 1.1 * pr.scale;
      ctx.fillRect(pr.sx - r/2, pr.sy - r/2, r, r);
    } else {
      ctx.fillStyle = 'rgba(80,110,180,' + (depthAlpha * 0.32).toFixed(3) + ')';
      const r = 0.9 * pr.scale;
      ctx.fillRect(pr.sx - r/2, pr.sy - r/2, r, r);
    }
  }

  /* arcs: behind-globe segments first, then front */
  const arcColor = NODE_COLORS;
  for (let a = 0; a < connectionArcs.length; a++) {
    const arc = connectionArcs[a];
    arc.t += arc.speed * (dt / 16.6667);
    if (arc.t >= 1) { arc.t = 1; arc.life -= 0.02 * (dt / 16.6667); }
    const pts = buildArcPoints(arc.p1, arc.p2, ARC_SEGMENTS, 0.35);
    const col = arcColor[arc.severity] || '#ff6600';

    /* full faint path */
    let prev = null;
    for (let i = 0; i < pts.length; i++) {
      const tp = transform(pts[i]);
      const pr = project(tp);
      if (prev) {
        ctx.strokeStyle = 'rgba(255,42,28,' + (0.05 + (tp.z + 1) / 2 * 0.10).toFixed(3) + ')';
        ctx.lineWidth = 0.6 * pr.scale;
        ctx.beginPath();
        ctx.moveTo(prev.sx, prev.sy);
        ctx.lineTo(pr.sx, pr.sy);
        ctx.stroke();
      }
      prev = pr;
    }

    /* moving bright head + fading trail (only visible on front hemisphere) */
    const head = arc.t;
    const trailLen = 0.18;
    let trailPrev = null;
    for (let f = 0; f <= 1; f += 0.02) {
      const tt = head - f * trailLen;
      if (tt < 0) continue;
      const idx = Math.round(tt * ARC_SEGMENTS);
      const tp = transform(pts[Math.min(ARC_SEGMENTS, idx)]);
      if (tp.z < -0.05) { trailPrev = null; continue; } // hide when behind globe
      const pr = project(tp);
      const alpha = (1 - f) * arc.life * 0.95;
      if (trailPrev) {
        ctx.strokeStyle = col;
        ctx.globalAlpha = alpha;
        ctx.lineWidth = (1.6 + (1 - f) * 1.8) * pr.scale;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(trailPrev.sx, trailPrev.sy);
        ctx.lineTo(pr.sx, pr.sy);
        ctx.stroke();
        ctx.globalAlpha = 1;
      }
      trailPrev = pr;
    }

    /* bright head dot */
    const hIdx = Math.round(head * ARC_SEGMENTS);
    const hp = transform(pts[Math.min(ARC_SEGMENTS, hIdx)]);
    if (hp.z > -0.05 && arc.life > 0.05) {
      const hpr = project(hp);
      ctx.fillStyle = col;
      ctx.globalAlpha = arc.life;
      ctx.beginPath();
      ctx.arc(hpr.sx, hpr.sy, 2.4 * hpr.scale, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
  /* remove dead arcs */
  for (let i = connectionArcs.length - 1; i >= 0; i--) {
    if (connectionArcs[i].life <= 0) connectionArcs.splice(i, 1);
  }

  /* attack nodes (endpoints) with glow + pulse */
  const time = now / 1000;
  hoveredNode = null;
  let bestDist = 14 * 14;
  const highlight = highlightedNodeId;
  for (let i = 0; i < nodeSprites.length; i++) {
    const ns = nodeSprites[i];
    const tp = transform(ns.pos);
    const pr = project(tp);
    const onFront = tp.z > 0.02;
    const col = NODE_COLORS[ns.severity] || '#ff6600';

    const base = ns.severity === 'critical' ? 3.2 : ns.severity === 'high' ? 2.6 : 2.1;
    const pulse = 1 + 0.3 * Math.sin(time * 2.5 + ns.phase);
    let r = base * pulse * pr.scale;
    let alpha = onFront ? 1 : 0.18;

    if (highlight) {
      alpha = (ns.attackId === highlight) ? (onFront ? 1 : 0.3) : 0.12;
    }

    if (onFront || highlight) {
      ctx.globalAlpha = alpha * 0.35;
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, r * 2.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(pr.sx, pr.sy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    /* hover picking (front only) */
    if (onFront && mouseInside) {
      const dx = pr.sx - mouseX, dy = pr.sy - mouseY;
      const d2 = dx * dx + dy * dy;
      if (d2 < bestDist) { bestDist = d2; hoveredNode = ns; }
    }
  }

  /* tooltip */
  if (hoveredNode && mouseInside) {
    tooltipEl.querySelector('#tt-ip').textContent = hoveredNode.ip || '--';
    tooltipEl.querySelector('#tt-attack').textContent = hoveredNode.attackType || '--';
    tooltipEl.querySelector('#tt-port').textContent = hoveredNode.port || '--';
    tooltipEl.querySelector('#tt-status').textContent = hoveredNode.status || '--';
    let tx = mouseX + 14, ty = mouseY - 10;
    const tw = tooltipEl.offsetWidth, th = tooltipEl.offsetHeight;
    if (tx + tw > W) tx = mouseX - tw - 14;
    if (ty + th > H) ty = mouseY - th - 5;
    tooltipEl.style.left = tx + 'px';
    tooltipEl.style.top = ty + 'px';
    tooltipEl.classList.add('visible');
    canvas.style.cursor = 'pointer';
  } else {
    tooltipEl.classList.remove('visible');
    canvas.style.cursor = 'default';
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ── Periodic attack spawner ── */
function scheduleNextSpawn() {
  const delay = 800 + Math.random() * 2200;
  setTimeout(() => { spawnAttack(); scheduleNextSpawn(); }, delay);
}
/* startup burst */
for (let i = 0; i < 8; i++) setTimeout(spawnAttack, i * 400);
scheduleNextSpawn();

/* periodic stats refresh */
setInterval(updateGlobalStats, 5000);

/* keyboard: r toggles rotation, c clears highlight */
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') autoRotate = !autoRotate;
  if (e.key === 'c' || e.key === 'C') highlightedNodeId = null;
});

console.log('THREAT GLOBE (pure Canvas 2D) initialized — monitoring global attack surface');
</script>
