<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Depth Marquee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            overflow-x: hidden;
        }

        .marquee-track {
            display: flex;
            width: max-content;
            will-change: transform;
        }

        @keyframes marquee-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @keyframes marquee-right {
            0% { transform: translateX(-50%); }
            100% { transform: translateX(0); }
        }

        .animate-marquee-left {
            animation: marquee-left var(--speed, 30s) linear infinite;
        }

        .animate-marquee-right {
            animation: marquee-right var(--speed, 30s) linear infinite;
        }

        .paused {
            animation-play-state: paused !important;
        }

        .card-glow {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-glow:hover {
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.15), 0 0 80px rgba(255, 255, 255, 0.05);
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.03;
            z-index: 100;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 90;
            background: radial-gradient(ellipse at center, transparent 0%, transparent 50%, rgba(0,0,0,0.6) 100%);
        }

        .scroll-indicator {
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        .title-reveal {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
        }

        .card-container:hover .title-reveal {
            opacity: 1;
            transform: translateY(0);
        }

        .overlay-fade {
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .card-container:hover .overlay-fade {
            opacity: 0;
        }

        /* Smooth scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Unsplash image collections
        const UNSPLASH_IMAGES = [
            "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80",
            "https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&q=80",
            "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=800&q=80",
            "https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=800&q=80",
            "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800&q=80",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&q=80",
            "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80",
            "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=800&q=80",
            "https://images.unsplash.com/photo-1501854140801-50d01698950b?w=800&q=80",
            "https://images.unsplash.com/photo-1518173946687-a4c036bc3c95?w=800&q=80",
            "https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=800&q=80",
            "https://images.unsplash.com/photo-1426604966848-d7adac402bff?w=800&q=80",
            "https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?w=800&q=80",
            "https://images.unsplash.com/photo-1507608616759-54f48f0af0ee?w=800&q=80",
            "https://images.unsplash.com/photo-1511497584788-876760111969?w=800&q=80",
            "https://images.unsplash.com/photo-1475924156734-496f6cac6ec1?w=800&q=80",
            "https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=800&q=80",
            "https://images.unsplash.com/photo-1518837695005-2083093ee35b?w=800&q=80",
        ];

        const LAYER_CONFIGS = [
            { 
                zIndex: 0, 
                speed: 180, 
                blur: "blur-sm", 
                opacity: 0.30, 
                scale: 0.85, 
                grayscale: true,
                imageCount: 8,
                direction: "left",
                mouseSensitivity: 0.1
            },
            { 
                zIndex: 10, 
                speed: 140, 
                blur: "blur-[2px]", 
                opacity: 0.45, 
                scale: 0.90, 
                grayscale: false,
                imageCount: 10,
                direction: "right",
                mouseSensitivity: 0.2
            },
            { 
                zIndex: 20, 
                speed: 100, 
                blur: "blur-[1px]", 
                opacity: 0.60, 
                scale: 0.95, 
                grayscale: false,
                imageCount: 12,
                direction: "left",
                mouseSensitivity: 0.35
            },
            { 
                zIndex: 30, 
                speed: 70, 
                blur: "", 
                opacity: 0.75, 
                scale: 1.00, 
                grayscale: false,
                imageCount: 14,
                direction: "right",
                mouseSensitivity: 0.5
            },
            { 
                zIndex: 40, 
                speed: 45, 
                blur: "", 
                opacity: 0.90, 
                scale: 1.05, 
                grayscale: false,
                imageCount: 16,
                direction: "left",
                mouseSensitivity: 0.7
            },
            { 
                zIndex: 50, 
                speed: 25, 
                blur: "", 
                opacity: 1.00, 
                scale: 1.10, 
                grayscale: false,
                imageCount: 18,
                direction: "right",
                mouseSensitivity: 1.0
            },
        ];

        const IMAGE_TITLES = [
            "Misty Peaks", "Golden Valley", "Ancient Forest", "Hidden Waterfall",
            "Azure Lake", "Morning Mist", "Sunlit Woods", "Highland Meadow",
            "Emerald Canopy", "Twilight Ridge", "Crystal River", "Wildflower Fields",
            "Canyon Echo", "Storm Pass", "Silent Glacier", "Autumn Trail",
            "Ocean Cliffs", "Desert Dunes", "Alpine Lake", "Rainforest Dawn"
        ];

        function getShuffledImages(count) {
            const shuffled = [...UNSPLASH_IMAGES].sort(() => Math.random() - 0.5);
            const result = [];
            for (let i = 0; i < count; i++) {
                result.push({
                    url: shuffled[i % shuffled.length],
                    title: IMAGE_TITLES[i % IMAGE_TITLES.length],
                    id: `img-${i}-${Date.now()}`
                });
            }
            return result;
        }

        function MarqueeCard({ image, isFrontLayer, isPaused }) {
            const [isHovered, setIsHovered] = useState(false);

            return (
                <div 
                    className={`card-container relative flex-shrink-0 mx-3 transition-all duration-500 ease-out ${
                        isFrontLayer && isHovered ? 'scale-[1.15] z-[100]' : ''
                    }`}
                    style={{
                        transform: isFrontLayer && isHovered ? 'scale(1.15)' : 'scale(1)',
                        zIndex: isFrontLayer && isHovered ? 100 : 'auto'
                    }}
                    onMouseEnter={() => setIsHovered(true)}
                    onMouseLeave={() => setIsHovered(false)}
                >
                    <div className={`relative overflow-hidden rounded-xl shadow-2xl card-glow ${
                        isFrontLayer && isHovered ? 'shadow-white/20' : ''
                    }`} style={{ width: '320px', aspectRatio: '16/9' }}>
                        <img 
                            src={image.url} 
                            alt={image.title}
                            className="w-full h-full object-cover transition-transform duration-700"
                            style={{
                                transform: isFrontLayer && isHovered ? 'scale(1.1)' : 'scale(1)'
                            }}
                            loading="lazy"
                        />
                        <div className={`overlay-fade absolute inset-0 bg-gradient-to-t from-black/70 via-black/20 to-transparent ${
                            isFrontLayer && isHovered ? 'opacity-0' : 'opacity-100'
                        }`} />
                        <div className="absolute bottom-0 left-0 right-0 p-4">
                            <h3 className={`title-reveal text-white font-semibold text-sm tracking-wide ${
                                isFrontLayer && isHovered ? 'opacity-100 translate-y-0' : ''
                            }`}>
                                {image.title}
                            </h3>
                            <p className={`title-reveal text-white/60 text-xs mt-1 transition-delay-100 ${
                                isFrontLayer && isHovered ? 'opacity-100 translate-y-0' : ''
                            }`}>
                                Nature Collection
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        function MarqueeLayer({ config, layerIndex, scrollY, mouseX, isFrontLayer }) {
            const [images, setImages] = useState(() => getShuffledImages(config.imageCount));
            const [isPaused, setIsPaused] = useState(false);
            const trackRef = useRef(null);
            const [speedMultiplier, setSpeedMultiplier] = useState(1);

            // Mouse influence on speed
            useEffect(() => {
                const normalizedMouse = (mouseX / window.innerWidth - 0.5) * 2; // -1 to 1
                const newMultiplier = 1 + (normalizedMouse * config.mouseSensitivity * 0.5);
                setSpeedMultiplier(Math.max(0.2, Math.min(3, newMultiplier)));
            }, [mouseX, config.mouseSensitivity]);

            // Parallax scroll offset
            const parallaxOffset = scrollY * (0.05 + (layerIndex * 0.03));

            const animationClass = config.direction === 'left' 
                ? 'animate-marquee-left' 
                : 'animate-marquee-right';

            // Duplicate images for seamless loop
            const duplicatedImages = [...images, ...images];

            return (
                <div 
                    className="absolute inset-0 flex items-center"
                    style={{
                        zIndex: config.zIndex,
                        transform: `translateY(${parallaxOffset}px)`,
                        opacity: config.opacity,
                        filter: config.blur ? config.blur : 'none',
                    }}
                >
                    <div 
                        ref={trackRef}
                        className={`marquee-track ${animationClass} ${isPaused ? 'paused' : ''}`}
                        style={{
                            ['--speed' as string]: `${config.speed / speedMultiplier}s`,
                            transform: `scale(${config.scale})`,
                        }}
                        onMouseEnter={() => isFrontLayer && setIsPaused(true)}
                        onMouseLeave={() => setIsPaused(false)}
                    >
                        {duplicatedImages.map((image, idx) => (
                            <MarqueeCard 
                                key={`${image.id}-${idx}`}
                                image={image}
                                isFrontLayer={isFrontLayer}
                                isPaused={isPaused}
                            />
                        ))}
                    </div>
                </div>
            );
        }

        function ParallaxDepthMarquee() {
            const [scrollY, setScrollY] = useState(0);
            const [mouseX, setMouseX] = useState(window.innerWidth / 2);
            const containerRef = useRef(null);

            useEffect(() => {
                let ticking = false;

                const handleScroll = () => {
                    if (!ticking) {
                        window.requestAnimationFrame(() => {
                            setScrollY(window.scrollY);
                            ticking = false;
                        });
                        ticking = true;
                    }
                };

                const handleMouseMove = (e) => {
                    setMouseX(e.clientX);
                };

                window.addEventListener('scroll', handleScroll, { passive: true });
                window.addEventListener('mousemove', handleMouseMove, { passive: true });

                return () => {
                    window.removeEventListener('scroll', handleScroll);
                    window.removeEventListener('mousemove', handleMouseMove);
                };
            }, []);

            return (
                <div ref={containerRef} className="relative min-h-[300vh]">
                    {/* Background gradient */}
                    <div 
                        className="fixed inset-0"
                        style={{
                            background: 'linear-gradient(180deg, #0a0a0a 0%, #111111 30%, #0a0a0a 60%, #050505 100%)'
                        }}
                    />

                    {/* Noise overlay */}
                    <div className="noise-overlay" />

                    {/* Vignette */}
                    <div className="vignette" />

                    {/* Hero Section */}
                    <div className="fixed inset-0 flex flex-col items-center justify-center z-[60] pointer-events-none">
                        <h1 className="text-6xl md:text-8xl font-extrabold text-white/90 tracking-tighter mb-4"
                            style={{ textShadow: '0 0 80px rgba(255,255,255,0.1)' }}>
                            DEPTH
                        </h1>
                        <p className="text-white/40 text-lg md:text-xl font-light tracking-widest uppercase mb-8">
                            Parallax Marquee Experience
                        </p>
                        <div className="scroll-indicator flex flex-col items-center text-white/30">
                            <span className="text-xs uppercase tracking-widest mb-2">Scroll to Explore</span>
                            <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                            </svg>
                        </div>
                    </div>

                    {/* Marquee Layers Container */}
                    <div className="fixed inset-0 overflow-hidden">
                        {LAYER_CONFIGS.map((config, index) => (
                            <MarqueeLayer
                                key={index}
                                config={config}
                                layerIndex={index}
                                scrollY={scrollY}
                                mouseX={mouseX}
                                isFrontLayer={index === LAYER_CONFIGS.length - 1}
                            />
                        ))}
                    </div>

                    {/* Scroll spacer */}
                    <div className="relative z-[70] mt-[100vh]">
                        <div className="h-[200vh]" />
                    </div>

                    {/* Footer */}
                    <div className="relative z-[70] bg-black/80 backdrop-blur-xl py-20 px-8">
                        <div className="max-w-4xl mx-auto text-center">
                            <h2 className="text-3xl md:text-4xl font-bold text-white/90 mb-6">
                                6 Layers of Depth
                            </h2>
                            <p className="text-white/50 text-lg leading-relaxed mb-8 max-w-2xl mx-auto">
                                Each layer moves at a different speed, creating an immersive parallax experience. 
                                The front layer responds to your mouse position, while scroll shifts all layers vertically 
                                at different rates.
                            </p>
                            <div className="grid grid-cols-2 md:grid-cols-3 gap-4 max-w-xl mx-auto">
                                {LAYER_CONFIGS.map((config, i) => (
                                    <div key={i} className="bg-white/5 rounded-lg p-4 border border-white/10">
                                        <div className="text-white/80 font-semibold text-sm">Layer {i + 1}</div>
                                        <div className="text-white/40 text-xs mt-1">Speed: {config.speed}s</div>
                                        <div className="text-white/40 text-xs">Opacity: {Math.round(config.opacity * 100)}%</div>
                                    </div>
                                ))}
                            </div>
                            <p className="text-white/30 text-sm mt-12">
                                Built with React + Tailwind CSS • Pure CSS 3D Transforms • No External Libraries
                            </p>
                        </div>
                    </div>
                </div>
            );
        }

        function App() {
            return <ParallaxDepthMarquee />;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

<a id="audit-backlink" href="index.html" title="Back to Components (ESC)" style="position:fixed;bottom:16px;left:16px;z-index:99999;text-decoration:none;font:600 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.06em;color:#e9edf5;background:rgba(3,5,10,.85);border:1px solid rgba(34,211,238,.35);padding:9px 16px;border-radius:9999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 4px 20px rgba(0,0,0,.5);display:inline-flex;align-items:center;gap:6px;">&#8592; Components</a>
<script>
window.addEventListener("keydown", function(e) {
  if (e.key === "Escape") window.location.href = "index.html";
});
</script>
</body>
</html>
