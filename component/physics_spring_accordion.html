<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Physics Spring Accordion</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body {
    background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .accordion-wrap {
    width: 100%;
    max-width: 560px;
  }
  .accordion-item {
    margin-bottom: 12px;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.08);
    position: relative;
    transition: border-color 0.3s;
  }
  .accordion-item::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 16px;
    padding: 1.5px;
    background: linear-gradient(135deg, rgba(99,102,241,0.4), rgba(236,72,153,0.3), rgba(99,102,241,0.4));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
  }
  .accordion-item.active::before { opacity: 1; }
  .accordion-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 22px;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
    z-index: 2;
  }
  .accordion-header:hover { background: rgba(255,255,255,0.03); }
  .accordion-title {
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.01em;
  }
  .accordion-icon {
    width: 20px;
    height: 20px;
    color: rgba(255,255,255,0.5);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    flex-shrink: 0;
  }
  .accordion-item.active .accordion-icon { transform: rotate(180deg); }
  .accordion-content {
    overflow: hidden;
    position: relative;
    z-index: 1;
  }
  .accordion-body {
    padding: 0 22px 20px;
    font-size: 14px;
    line-height: 1.7;
    color: rgba(255,255,255,0.55);
    opacity: 0;
    transform: translateY(-8px);
    transition: opacity 0.35s ease, transform 0.35s ease;
  }
  .accordion-item.active .accordion-body {
    opacity: 1;
    transform: translateY(0);
  }
  .drag-handle {
    cursor: grab;
    padding: 4px 8px;
    margin-right: 10px;
    color: rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
  }
  .drag-handle:active { cursor: grabbing; }
  .accordion-header-content {
    display: flex;
    align-items: center;
    flex: 1;
  }
  .reordering .accordion-item {
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
</style>
</head>
<body>

<div class="accordion-wrap" id="accordion">
  <!-- Items injected by JS -->
</div>

<script>
(function(){
  const itemsData = [
    { title: "React Server Components", body: "Arsitektur rendering baru yang memungkinkan komponen dirender di server dan mengirimkan HTML minimal ke client. Mengurangi bundle size secara drastis." },
    { title: "Signals & Fine-Grained Reactivity", body: "Paradigma reaktivitas di mana state update hanya memicu re-render pada bagian UI yang benar-benar bergantung padanya, bukan seluruh komponen." },
    { title: "WebAssembly & Rust", body: "Menjalankan kode near-native di browser. Rust menjadi bahasa pilihan karena zero-cost abstractions dan memory safety tanpa garbage collector." },
    { title: "Edge Computing", body: "Menjalankan fungsi di edge network terdekat dengan pengguna. Latency turun drastis, dan cold start hampir tidak terasa." },
    { title: "CSS Container Queries", body: "Media queries berbasis container, bukan viewport. Komponen UI menjadi benar-benar self-contained dan reusable tanpa khawatir konteks layout." },
    { title: "View Transitions API", body: "Animasi cross-fade antar halaman secara native di browser. Tidak perlu library routing khusus untuk transisi yang mulus." },
  ];

  // Spring physics per item: { targetHeight, currentHeight, velocity, stiffness, damping, mass }
  const springs = [];
  let openIndex = -1;
  const container = document.getElementById('accordion');

  function createItems() {
    container.innerHTML = '';
    itemsData.forEach((item, i) => {
      const el = document.createElement('div');
      el.className = 'accordion-item';
      el.dataset.index = i;
      el.innerHTML = `
        <div class="accordion-header">
          <div class="accordion-header-content">
            <div class="drag-handle" data-drag="${i}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="12" r="1"/><circle cx="9" cy="5" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="19" r="1"/></svg>
            </div>
            <span class="accordion-title">${item.title}</span>
          </div>
          <svg class="accordion-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="accordion-content" style="height:0px">
          <div class="accordion-body">${item.body}</div>
        </div>
      `;
      container.appendChild(el);

      // Unique spring params for each item
      springs[i] = {
        target: 0,
        current: 0,
        velocity: 0,
        stiffness: 140 + Math.random() * 160,
        damping: 10 + Math.random() * 10,
        mass: 1 + Math.random() * 1.5,
        el: el.querySelector('.accordion-content'),
        bodyEl: el.querySelector('.accordion-body'),
      };

      el.querySelector('.accordion-header').addEventListener('click', (e) => {
        if (e.target.closest('.drag-handle')) return;
        toggleItem(i);
      });
    });
    setupDragReorder();
  }

  function toggleItem(index) {
    const wasOpen = openIndex === index;
    const prevOpen = openIndex;
    openIndex = wasOpen ? -1 : index;

    itemsData.forEach((_, i) => {
      const itemEl = container.children[i];
      if (i === openIndex) itemEl.classList.add('active');
      else itemEl.classList.remove('active');
    });

    // Set targets
    springs.forEach((s, i) => {
      if (i === openIndex) {
        s.target = s.bodyEl.scrollHeight + 20; // padding compensation
      } else {
        s.target = 0;
      }
    });
  }

  // rAF spring loop
  let rafId;
  function springLoop() {
    let active = false;
    springs.forEach(s => {
      const displacement = s.current - s.target;
      const springForce = -s.stiffness * displacement;
      const dampingForce = -s.damping * s.velocity;
      const acceleration = (springForce + dampingForce) / s.mass;
      s.velocity += acceleration * 0.016;
      s.current += s.velocity * 0.016;

      if (Math.abs(displacement) > 0.1 || Math.abs(s.velocity) > 0.1) active = true;

      s.el.style.height = Math.max(0, s.current) + 'px';
    });
    rafId = requestAnimationFrame(springLoop);
  }

  // Drag reorder
  let dragIndex = -1;
  let dragEl = null;
  let dragY = 0;
  let startY = 0;
  let placeholder = null;

  function setupDragReorder() {
    container.addEventListener('mousedown', onPointerDown);
    container.addEventListener('touchstart', onPointerDown, { passive: false });
  }

  function onPointerDown(e) {
    const handle = e.target.closest('.drag-handle');
    if (!handle) return;
    e.preventDefault();
    dragIndex = parseInt(handle.dataset.drag);
    dragEl = container.children[dragIndex];
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    startY = clientY;
    dragY = 0;

    dragEl.style.transition = 'none';
    dragEl.style.zIndex = '100';
    dragEl.style.position = 'relative';

    document.addEventListener('mousemove', onPointerMove);
    document.addEventListener('mouseup', onPointerUp);
    document.addEventListener('touchmove', onPointerMove, { passive: false });
    document.addEventListener('touchend', onPointerUp);
  }

  function onPointerMove(e) {
    if (dragIndex === -1) return;
    e.preventDefault();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    dragY = clientY - startY;
    dragEl.style.transform = `translateY(${dragY}px)`;

    // Determine swap target
    const items = Array.from(container.children);
    const dragRect = dragEl.getBoundingClientRect();
    const dragCenter = dragRect.top + dragRect.height / 2;

    for (let i = 0; i < items.length; i++) {
      if (i === dragIndex) continue;
      const rect = items[i].getBoundingClientRect();
      const center = rect.top + rect.height / 2;
      if (Math.abs(dragCenter - center) < rect.height / 2) {
        // Swap in DOM
        if (i < dragIndex) {
          container.insertBefore(dragEl, items[i]);
        } else {
          container.insertBefore(dragEl, items[i].nextSibling);
        }
        // Update indices
        const newItems = Array.from(container.children);
        dragIndex = newItems.indexOf(dragEl);
        // Recalculate startY to avoid jump
        const newRect = dragEl.getBoundingClientRect();
        startY = clientY - dragY;
        break;
      }
    }
  }

  function onPointerUp(e) {
    if (dragIndex === -1) return;
    document.removeEventListener('mousemove', onPointerMove);
    document.removeEventListener('mouseup', onPointerUp);
    document.removeEventListener('touchmove', onPointerMove);
    document.removeEventListener('touchend', onPointerUp);

    // Spring back to position
    dragEl.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
    dragEl.style.transform = 'translateY(0)';
    dragEl.style.zIndex = '';
    setTimeout(() => {
      dragEl.style.position = '';
      dragEl.style.transition = '';
      dragEl.style.transform = '';
    }, 500);

    dragIndex = -1;
    dragEl = null;
  }

  createItems();
  springLoop();
})();
</script>
