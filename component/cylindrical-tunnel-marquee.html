<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cylindrical Tunnel Marquee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* 3D Scene */
    .scene {
      perspective: 1200px;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .cylinder {
      position: relative;
      width: 400px;
      height: 300px;
      transform-style: preserve-3d;
      transition: transform 0.1s ease-out;
      will-change: transform;
    }

    .cylinder-inner {
      position: absolute;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      animation: rotateCylinder var(--rotation-duration, 30s) linear infinite;
      will-change: transform;
    }

    @keyframes rotateCylinder {
      from { transform: rotateY(0deg); }
      to { transform: rotateY(360deg); }
    }

    /* Individual Card */
    .card-wrapper {
      position: absolute;
      width: 320px;
      height: 220px;
      left: 50%;
      top: 50%;
      margin-left: -160px;
      margin-top: -110px;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .card-wrapper:hover {
      z-index: 100 !important;
    }

    .card-wrapper:hover .card {
      transform: scale(1.15) translateZ(80px);
      box-shadow: 0 25px 80px rgba(0,0,0,0.8), 0 0 40px rgba(255,255,255,0.1);
    }

    .card-wrapper:hover .card-overlay {
      opacity: 0;
    }

    .card-wrapper:hover .card-title {
      opacity: 1;
      transform: translateY(0);
    }

    .card {
      width: 100%;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      cursor: pointer;
      background: #1a1a1a;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.6s ease;
    }

    .card-wrapper:hover .card img {
      transform: scale(1.1);
    }

    .card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.5) 100%);
      transition: opacity 0.4s ease;
    }

    .card-title {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      color: white;
      font-size: 18px;
      font-weight: 600;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.4s ease;
      pointer-events: none;
    }

    /* Floor reflection */
    .floor {
      position: absolute;
      bottom: -200px;
      left: 50%;
      transform: translateX(-50%) rotateX(80deg);
      width: 2000px;
      height: 2000px;
      background: radial-gradient(ellipse at center, rgba(255,255,255,0.03) 0%, transparent 70%);
      pointer-events: none;
    }

    /* Vignette */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.8) 100%);
      z-index: 10;
    }

    /* UI Overlay */
    .ui-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 50;
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .ui-overlay > * {
      pointer-events: auto;
    }

    .speed-control {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px 20px;
      border-radius: 100px;
    }

    .speed-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 120px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 2px;
      outline: none;
    }

    .speed-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      background: white;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255,255,255,0.5);
    }

    .info-panel {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      text-align: center;
      pointer-events: none;
    }

    .info-panel p {
      color: rgba(255,255,255,0.4);
      font-size: 13px;
      letter-spacing: 0.05em;
    }

    /* Loading */
    .loading-screen {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .loading-screen.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      width: 48px;
      height: 48px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Ambient particles */
    .particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      pointer-events: none;
      animation: float linear infinite;
    }

    @keyframes float {
      from {
        transform: translateY(100vh) translateX(0);
        opacity: 0;
      }
      10% { opacity: 1; }
      90% { opacity: 1; }
      to {
        transform: translateY(-100px) translateX(50px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div class="loading-screen" id="loading">
    <div class="loader"></div>
  </div>

  <!-- Ambient Particles -->
  <div id="particles"></div>

  <!-- Vignette -->
  <div class="vignette"></div>

  <!-- UI Overlay -->
  <div class="ui-overlay">
    <div>
      <h1 class="text-white text-xl font-bold tracking-tight">Cylindrical Tunnel</h1>
      <p class="text-white/40 text-xs mt-0.5">3D Marquee Carousel</p>
    </div>
    <div class="speed-control">
      <span class="text-white/60 text-xs font-medium uppercase tracking-wider">Speed</span>
      <input type="range" class="speed-slider" id="speedSlider" min="5" max="60" value="30">
      <span class="text-white text-xs font-mono w-10 text-right" id="speedValue">30s</span>
    </div>
  </div>

  <!-- Info Panel -->
  <div class="info-panel">
    <p>Move mouse to shift perspective · Hover cards to focus · Scroll to change speed</p>
  </div>

  <!-- 3D Scene -->
  <div class="scene" id="scene">
    <div class="cylinder" id="cylinder">
      <div class="cylinder-inner" id="cylinderInner">
        <!-- Cards injected by JS -->
      </div>
    </div>
    <div class="floor"></div>
  </div>

  <script>
    // Unsplash Images
    const images = [
      { url: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=800&q=80", title: "Alpine Peak" },
      { url: "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=800&q=80", title: "Sunlit Forest" },
      { url: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&q=80", title: "Misty Valley" },
      { url: "https://images.unsplash.com/photo-1447752875215-b2761acb3c5d?w=800&q=80", title: "Forest Bridge" },
      { url: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800&q=80", title: "Ocean Sunset" },
      { url: "https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=800&q=80", title: "Aerial Valley" },
      { url: "https://images.unsplash.com/photo-1433086966358-54859d0ed716?w=800&q=80", title: "Waterfall" },
      { url: "https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=800&q=80", title: "Lake Reflection" },
      { url: "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?w=800&q=80", title: "Green Hills" },
      { url: "https://images.unsplash.com/photo-1501854140801-50d01698950b?w=800&q=80", title: "Aerial Nature" },
      { url: "https://images.unsplash.com/photo-1518173946687-a4c036bc3c95?w=800&q=80", title: "Foggy Mountains" },
      { url: "https://images.unsplash.com/photo-1497436072909-60f360e1d4b1?w=800&q=80", title: "Mountain Lake" },
      { url: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=800&q=80", title: "Rocky Summit" },
      { url: "https://images.unsplash.com/photo-1439853949127-fa647821eba0?w=800&q=80", title: "River Canyon" },
      { url: "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=800&q=80", title: "Morning Mist" },
      { url: "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?w=800&q=80", title: "Autumn Road" },
    ];

    const RADIUS = 650;
    const cylinderInner = document.getElementById('cylinderInner');
    const cylinder = document.getElementById('cylinder');
    const scene = document.getElementById('scene');
    const speedSlider = document.getElementById('speedSlider');
    const speedValue = document.getElementById('speedValue');

    let mouseX = 0, mouseY = 0;
    let targetRotateX = 0, targetRotateY = 0;
    let currentRotateX = 0, currentRotateY = 0;

    // Build cylinder cards
    function buildCylinder() {
      const count = images.length;
      const angleStep = 360 / count;

      images.forEach((img, i) => {
        const angle = i * angleStep;
        const rad = (angle * Math.PI) / 180;

        const wrapper = document.createElement('div');
        wrapper.className = 'card-wrapper';
        wrapper.style.transform = `rotateY(${angle}deg) translateZ(${RADIUS}px)`;
        wrapper.style.zIndex = Math.round(Math.cos(rad) * 100);

        wrapper.innerHTML = `
          <div class="card">
            <img src="${img.url}" alt="${img.title}" loading="lazy" onload="checkAllLoaded()">
            <div class="card-overlay"></div>
            <div class="card-title">${img.title}</div>
          </div>
        `;

        cylinderInner.appendChild(wrapper);
      });
    }

    // Mouse parallax
    document.addEventListener('mousemove', (e) => {
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      mouseX = (e.clientX - centerX) / centerX;
      mouseY = (e.clientY - centerY) / centerY;

      targetRotateY = mouseX * 10;
      targetRotateX = -mouseY * 8;
    });

    // Smooth animation loop
    function animate() {
      currentRotateX += (targetRotateX - currentRotateX) * 0.08;
      currentRotateY += (targetRotateY - currentRotateY) * 0.08;

      cylinder.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
      requestAnimationFrame(animate);
    }

    // Speed control
    speedSlider.addEventListener('input', (e) => {
      const val = e.target.value;
      cylinderInner.style.setProperty('--rotation-duration', val + 's');
      speedValue.textContent = val + 's';
    });

    // Scroll wheel speed
    document.addEventListener('wheel', (e) => {
      let val = parseInt(speedSlider.value);
      val += e.deltaY > 0 ? 2 : -2;
      val = Math.max(5, Math.min(60, val));
      speedSlider.value = val;
      cylinderInner.style.setProperty('--rotation-duration', val + 's');
      speedValue.textContent = val + 's';
    });

    // Ambient particles
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + 'vw';
        p.style.animationDuration = (15 + Math.random() * 20) + 's';
        p.style.animationDelay = (Math.random() * 15) + 's';
        p.style.opacity = Math.random() * 0.5 + 0.1;
        container.appendChild(p);
      }
    }

    // Loading
    let loadedCount = 0;
    function checkAllLoaded() {
      loadedCount++;
      if (loadedCount >= images.length) {
        setTimeout(() => {
          document.getElementById('loading').classList.add('hidden');
        }, 500);
      }
    }

    // Fallback loading timeout
    setTimeout(() => {
      document.getElementById('loading').classList.add('hidden');
    }, 4000);

    // Init
    buildCylinder();
    createParticles();
    animate();
  </script>
