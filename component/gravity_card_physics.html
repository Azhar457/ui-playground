<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gravity Card Physics</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0c10;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .grid-bg {
    position: absolute;
    inset: -50%;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    transform: skewX(-12deg);
    pointer-events: none;
    z-index: 0;
  }
  .viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    overflow: hidden;
  }
  .phys-card {
    position: absolute;
    width: 130px;
    height: 170px;
    border-radius: 14px;
    overflow: hidden;
    background: #1a1a2e;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    will-change: transform;
    transform-origin: center center;
    transition: box-shadow 0.3s, transform 0.1s linear;
  }
  .phys-card:active { cursor: grabbing; }
  .phys-card.hovered {
    box-shadow: 0 0 30px rgba(99,102,241,0.4), 0 8px 40px rgba(0,0,0,0.6);
    z-index: 1000 !important;
  }
  .phys-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
  }
  .phys-card-label {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    color: #fff;
    font-size: 12px;
    font-weight: 500;
    text-align: center;
    pointer-events: none;
  }
  .hint {
    position: absolute;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.3);
    font-size: 13px;
    pointer-events: none;
    z-index: 50;
    text-align: center;
    line-height: 1.6;
  }
  .counter {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.2);
    font-size: 12px;
    pointer-events: none;
    z-index: 50;
  }
</style>
</head>
<body>

<div class="grid-bg"></div>

<div class="hint">
  Drag to throw · Hover to freeze · Double-click to reset
</div>

<div class="viewport" id="viewport"></div>

<div class="counter" id="counter">Active: 18 cards</div>

<script>
(function(){
  const viewport = document.getElementById('viewport');
  const counter = document.getElementById('counter');

  const cardData = [
    { name: "Tokyo",     img: "https://images.unsplash.com/photo-1540959733332-eab4deabeeaf?w=300&h=400&fit=crop&q=80" },
    { name: "Paris",     img: "https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=300&h=400&fit=crop&q=80" },
    { name: "NYC",       img: "https://images.unsplash.com/photo-1496442226666-8d4d0e62e6e9?w=300&h=400&fit=crop&q=80" },
    { name: "Sydney",    img: "https://images.unsplash.com/photo-1506973035872-a4ec16b8e8d9?w=300&h=400&fit=crop&q=80" },
    { name: "Cairo",     img: "https://images.unsplash.com/photo-1572252009286-268acec5ca0a?w=300&h=400&fit=crop&q=80" },
    { name: "Rio",       img: "https://images.unsplash.com/photo-1483729558449-99ef09a8c325?w=300&h=400&fit=crop&q=80" },
    { name: "London",    img: "https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=300&h=400&fit=crop&q=80" },
    { name: "Dubai",     img: "https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=300&h=400&fit=crop&q=80" },
    { name: "Singapore", img: "https://images.unsplash.com/photo-1525625293386-3f8f99389edd?w=300&h=400&fit=crop&q=80" },
    { name: "Kyoto",     img: "https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=300&h=400&fit=crop&q=80" },
    { name: "Santorini", img: "https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?w=300&h=400&fit=crop&q=80" },
    { name: "Reykjavik", img: "https://images.unsplash.com/photo-1476610182048-b716b8518aae?w=300&h=400&fit=crop&q=80" },
    { name: "Marrakech", img: "https://images.unsplash.com/photo-1539020140153-e479b8c22e70?w=300&h=400&fit=crop&q=80" },
    { name: "Cape Town", img: "https://images.unsplash.com/photo-1580060839134-75a5edca2e99?w=300&h=400&fit=crop&q=80" },
    { name: "Hanoi",     img: "https://images.unsplash.com/photo-1528127269322-539801943592?w=300&h=400&fit=crop&q=80" },
    { name: "Venice",    img: "https://images.unsplash.com/photo-1514890547357-a9ee288728e0?w=300&h=400&fit=crop&q=80" },
    { name: "Patagonia", img: "https://images.unsplash.com/photo-1518182170546-0766bc6f9213?w=300&h=400&fit=crop&q=80" },
    { name: "Maldives",  img: "https://images.unsplash.com/photo-1514282401047-d79a71a590e8?w=300&h=400&fit=crop&q=80" },
  ];

  const W = window.innerWidth;
  const H = window.innerHeight;
  const CARD_W = 130;
  const CARD_H = 170;
  const G = 0.45;
  const FRICTION = 0.985;
  const RESTITUTION = 0.55;

  const cards = [];
  let draggedCard = null;
  let dragOffsetX = 0;
  let dragOffsetY = 0;
  let mouseX = 0;
  let mouseY = 0;
  let prevMouseX = 0;
  let prevMouseY = 0;

  function resetCards() {
    viewport.innerHTML = '';
    cards.length = 0;
    cardData.forEach((data, i) => {
      const el = document.createElement('div');
      el.className = 'phys-card';
      el.innerHTML = `<img src="${data.img}" alt="${data.name}" loading="lazy" /><div class="phys-card-label">${data.name}</div>`;
      viewport.appendChild(el);

      cards.push({
        el: el,
        x: Math.random() * (W - CARD_W),
        y: -Math.random() * 800 - i * 60,
        vx: (Math.random() - 0.5) * 3,
        vy: Math.random() * 2,
        w: CARD_W,
        h: CARD_H,
        mass: 0.8 + Math.random() * 0.7,
        restitution: RESTITUTION + Math.random() * 0.2,
        frozen: false,
        hovered: false,
        rotation: (Math.random() - 0.5) * 10,
        vRot: (Math.random() - 0.5) * 0.5,
      });
    });
    counter.textContent = `Active: ${cards.length} cards`;
  }

  function aabbOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function resolveCollision(a, b) {
    const cx = (a.x + a.w/2) - (b.x + b.w/2);
    const cy = (a.y + a.h/2) - (b.y + b.h/2);
    const overlapX = (a.w + b.w)/2 - Math.abs(cx);
    const overlapY = (a.h + b.h)/2 - Math.abs(cy);

    if (overlapX < overlapY) {
      const dir = cx > 0 ? 1 : -1;
      a.x += overlapX * dir * 0.5;
      b.x -= overlapX * dir * 0.5;
      const vRel = a.vx - b.vx;
      a.vx -= vRel * 0.5;
      b.vx += vRel * 0.5;
    } else {
      const dir = cy > 0 ? 1 : -1;
      a.y += overlapY * dir * 0.5;
      b.y -= overlapY * dir * 0.5;
      const vRel = a.vy - b.vy;
      a.vy -= vRel * 0.5;
      b.vy += vRel * 0.5;
    }
  }

  function physicsLoop() {
    const vw = window.innerWidth;
    const vh = window.innerHeight;

    cards.forEach(c => {
      if (c.frozen) return;

      // Gravity
      c.vy += G * c.mass;
      c.vx *= FRICTION;
      c.vy *= FRICTION;
      c.vRot *= 0.98;

      c.x += c.vx;
      c.y += c.vy;
      c.rotation += c.vRot;

      // Floor bounce
      if (c.y + c.h > vh - 10) {
        c.y = vh - 10 - c.h;
        c.vy *= -c.restitution;
        c.vRot += c.vx * 0.3;
      }
      // Walls
      if (c.x < 0) { c.x = 0; c.vx *= -c.restitution; }
      if (c.x + c.w > vw) { c.x = vw - c.w; c.vx *= -c.restitution; }
      // Ceiling
      if (c.y < -2000) { c.y = -200; c.vy = 0; }
    });

    // Collisions
    for (let i = 0; i < cards.length; i++) {
      for (let j = i + 1; j < cards.length; j++) {
        if (aabbOverlap(cards[i], cards[j])) {
          resolveCollision(cards[i], cards[j]);
        }
      }
    }

    // Render
    cards.forEach((c, i) => {
      const scale = c.hovered ? 1.1 : 1;
      c.el.style.transform = `translate(${c.x.toFixed(1)}px, ${c.y.toFixed(1)}px) rotate(${c.rotation.toFixed(1)}deg) scale(${scale})`;
      c.el.style.zIndex = c.hovered ? 1000 : Math.round(c.y);
    });

    requestAnimationFrame(physicsLoop);
  }

  // Mouse / Touch interactions
  function getCardAt(x, y) {
    for (let i = cards.length - 1; i >= 0; i--) {
      const c = cards[i];
      if (x >= c.x && x <= c.x + c.w && y >= c.y && y <= c.y + c.h) {
        return c;
      }
    }
    return null;
  }

  function onPointerDown(e) {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const c = getCardAt(clientX, clientY);
    if (c) {
      draggedCard = c;
      dragOffsetX = clientX - c.x;
      dragOffsetY = clientY - c.y;
      c.vx = 0;
      c.vy = 0;
      c.vRot = 0;
      prevMouseX = clientX;
      prevMouseY = clientY;
      e.preventDefault();
    }
  }

  function onPointerMove(e) {
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    mouseX = clientX;
    mouseY = clientY;

    if (draggedCard) {
      draggedCard.x = clientX - dragOffsetX;
      draggedCard.y = clientY - dragOffsetY;
      draggedCard.vx = (clientX - prevMouseX) * 0.8;
      draggedCard.vy = (clientY - prevMouseY) * 0.8;
      prevMouseX = clientX;
      prevMouseY = clientY;
    }

    // Hover detection
    const hovered = getCardAt(clientX, clientY);
    cards.forEach(c => {
      if (c === hovered && !draggedCard) {
        if (!c.hovered) {
          c.hovered = true;
          c.frozen = true;
          c.el.classList.add('hovered');
        }
      } else if (c !== draggedCard) {
        if (c.hovered) {
          c.hovered = false;
          c.frozen = false;
          c.el.classList.remove('hovered');
        }
      }
    });
  }

  function onPointerUp() {
    if (draggedCard) {
      draggedCard.frozen = false;
      draggedCard.hovered = false;
      draggedCard.el.classList.remove('hovered');
      draggedCard = null;
    }
  }

  viewport.addEventListener('mousedown', onPointerDown);
  window.addEventListener('mousemove', onPointerMove);
  window.addEventListener('mouseup', onPointerUp);

  viewport.addEventListener('touchstart', onPointerDown, { passive: false });
  window.addEventListener('touchmove', onPointerMove, { passive: false });
  window.addEventListener('touchend', onPointerUp);

  viewport.addEventListener('dblclick', () => {
    resetCards();
  });

  resetCards();
  physicsLoop();
})();
</script>

</script>
</body>
</html>
