<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Magnetic UI System</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(145deg, #0c0c14 0%, #151520 50%, #0a0a10 100%);
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
    color: #fff;
  }
  .magnetic-scene {
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    position: relative;
  }
  .magnetic-title {
    font-size: 14px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-bottom: 48px;
    text-align: center;
  }
  .magnetic-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    max-width: 720px;
    width: 100%;
  }
  @media (max-width: 640px) {
    .magnetic-grid { grid-template-columns: repeat(2, 1fr); gap: 20px; }
  }
  .magnetic-item {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 20px;
    border-radius: 18px;
    background: rgba(255,255,255,0.04);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.06);
    cursor: pointer;
    transition: border-color 0.4s, box-shadow 0.4s;
    will-change: transform;
    transform-style: preserve-3d;
    user-select: none;
    -webkit-user-select: none;
  }
  .magnetic-item:hover {
    border-color: rgba(255,255,255,0.15);
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }
  .magnetic-item .icon-wrap {
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: rgba(255,255,255,0.06);
    margin-bottom: 14px;
    transition: background 0.3s;
  }
  .magnetic-item:hover .icon-wrap {
    background: rgba(255,255,255,0.1);
  }
  .magnetic-item .label {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.75);
    text-align: center;
  }
  .magnetic-item .sublabel {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    margin-top: 4px;
    text-align: center;
  }
  .magnetic-btn {
    margin-top: 48px;
    padding: 16px 40px;
    border-radius: 14px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.9);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    will-change: transform;
    transition: background 0.3s, border-color 0.3s;
  }
  .magnetic-btn:hover {
    background: rgba(255,255,255,0.12);
    border-color: rgba(255,255,255,0.2);
  }
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    transform: scale(0);
    animation: rippleAnim 0.6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes rippleAnim {
    to { transform: scale(4); opacity: 0; }
  }
  .magnetic-badge {
    position: absolute;
    top: -10px;
    right: -10px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 600;
    color: #fff;
    box-shadow: 0 4px 15px rgba(99,102,241,0.4);
    will-change: transform;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="magnetic-scene" id="scene">
  <div class="magnetic-title">Magnetic UI System — Hover to feel the pull</div>

  <div class="magnetic-grid" id="grid">
    <div class="magnetic-item" data-magnetic>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </div>
        <div class="label">Design</div>
        <div class="sublabel">UI/UX Systems</div>
      </div>
      <div class="magnetic-badge">3</div>
    </div>

    <div class="magnetic-item" data-magnetic>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        </div>
        <div class="label">Develop</div>
        <div class="sublabel">Frontend Stack</div>
      </div>
    </div>

    <div class="magnetic-item" data-magnetic>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </div>
        <div class="label">Deploy</div>
        <div class="sublabel">CI/CD Pipeline</div>
      </div>
      <div class="magnetic-badge">7</div>
    </div>

    <div class="magnetic-item" data-magnetic>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        </div>
        <div class="label">Monitor</div>
        <div class="sublabel">Real-time Metrics</div>
      </div>
    </div>

    <div class="magnetic-item" data-magnetic>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div class="label">Collaborate</div>
        <div class="sublabel">Team Workspace</div>
      </div>
    </div>

    <div class="magnetic-item" data-magnetic>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="icon-wrap">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        </div>
        <div class="label">Document</div>
        <div class="sublabel">Knowledge Base</div>
      </div>
      <div class="magnetic-badge">12</div>
    </div>
  </div>

  <button class="magnetic-btn" data-magnetic data-ripple>Explore All Features</button>
</div>

<script>
(function(){
  const magneticElements = document.querySelectorAll('[data-magnetic]');
  const lerp = (a, b, n) => (1 - n) * a + n * b;

  magneticElements.forEach(el => {
    const state = { x: 0, y: 0, targetX: 0, targetY: 0 };
    const strength = el.classList.contains('magnetic-btn') ? 0.6 : 0.45;
    const range = el.classList.contains('magnetic-btn') ? 200 : 160;

    el.addEventListener('mousemove', (e) => {
      const rect = el.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;
      const distX = e.clientX - centerX;
      const distY = e.clientY - centerY;
      const distance = Math.sqrt(distX * distX + distY * distY);

      if (distance < range) {
        const pull = (1 - distance / range) * strength;
        state.targetX = distX * pull;
        state.targetY = distY * pull;
      }
    });

    el.addEventListener('mouseleave', () => {
      state.targetX = 0;
      state.targetY = 0;
    });

    function animate() {
      state.x = lerp(state.x, state.targetX, 0.12);
      state.y = lerp(state.y, state.targetY, 0.12);
      el.style.transform = `translate(${state.x.toFixed(2)}px, ${state.y.toFixed(2)}px)`;
      requestAnimationFrame(animate);
    }
    animate();
  });

  // Ripple effect
  document.querySelectorAll('[data-ripple]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const rect = btn.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      const size = Math.max(rect.width, rect.height);
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
      btn.appendChild(ripple);
      setTimeout(() => ripple.remove(), 600);
    });
  });
})();
</script>

</body>
</html>
